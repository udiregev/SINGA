<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Singa — Audience</title>
<meta name="theme-color" content="#1A0E38">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0..1,0" rel="stylesheet">
<style>
/* Singa · Night — deep violet, glass, pink accent (same look as the performer app) */
:root{
  --bg:transparent; --fg:#fff; --muted:rgba(255,255,255,.7); --line:rgba(255,255,255,.12); --s1:rgba(255,255,255,.08); --s2:rgba(255,255,255,.12);
  --accent:#F3B8FF; --ink:#2A1250; --sheet:#2A1250; --canvas:#1A0E38;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:#1A0E38}
html,body{margin:0;height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(172deg,#1A0E38 0%,#33145C 48%,#6E1C78 100%) fixed #1A0E38;overscroll-behavior-y:none}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;vertical-align:middle}
a{color:var(--accent)}
input,textarea,button{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform 160ms var(--ease-out),background-color .2s ease,color .2s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:rgba(255,255,255,.45)}
#app{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;width:100%;position:relative}
#head{flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;padding-top:env(safe-area-inset-top,0px);height:calc(60px + env(safe-area-inset-top,0px))}
.wordmark{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wm{display:block;height:1em;width:auto;aspect-ratio:2840/1101;overflow:visible;color:#fff}
.wordmark .wm{height:26px}
.tv-brand .wm{height:1.25em}
.live{background:var(--accent);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#C2185B}
.iconbtn{border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#fff}
.headbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
#main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.pad{padding:12px 22px}
.btn{height:54px;border:0;border-radius:999px;background:#fff;color:var(--ink);font-size:16px;font-weight:700}
.btn-outline{height:44px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:transparent;color:#fff;font-size:14px;font-weight:600;padding:0 16px}
input.field{height:50px;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:0 16px;font-size:16px;outline:none;background:rgba(255,255,255,.08);color:#fff;width:100%;caret-color:var(--accent)}
input.field:focus{border-color:rgba(243,184,255,.7)}
/* artwork */
.nart{position:relative;display:inline-block;flex:none;overflow:hidden;vertical-align:middle}
.nart i{position:absolute;border-radius:50%;display:block}
/* ---- Join ---- */
.join{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 26px 26px}
.join .nart{box-shadow:0 24px 60px rgba(14,6,32,.45)}
.join h1{margin:16px 0 0;font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
/* ---- Lyrics tab ---- */
.nowbar{display:flex;align-items:center;gap:12px;padding:6px 22px 4px}
.nowbar .t{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin:12px 22px 0;overflow:hidden}
.prog>div{height:100%;background:var(--accent);border-radius:2px}
.lyrics-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%;max-width:820px;text-align:center}
.lline{display:flex;flex-wrap:wrap;justify-content:center;unicode-bidi:plaintext}
.lword .ltext{padding:0 .13em}
.lword{display:flex;flex-direction:column;cursor:default}
.lword .ltext{font-size:22px;font-weight:300;color:rgba(255,255,255,.5);transition:color .15s ease}
.lline.cur .lword .ltext{font-size:30px;font-weight:500;color:#fff;letter-spacing:-.01em}
.lline.cur .lword.cur .ltext,.lline.cur .lword.done .ltext{color:var(--accent)}
.lword.line .ltext{color:#fff}
.lline.lheader{align-self:center;height:24px;border-radius:12px;background:rgba(243,184,255,.16);color:var(--accent);padding:0 10px;display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.lyr4{flex:1;min-height:0;overflow:hidden;padding:20px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* guests can scroll the whole song; it follows the singer until they scroll, then a pill takes them back */
#main:has(.lyrBox){padding-bottom:0}
.lyrBox{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.lyrBox .lyr4{display:block;overflow-y:auto;overscroll-behavior:contain;position:relative;padding:30vh 22px 55vh;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent 0,#000 9%,#000 78%,transparent 96%);mask-image:linear-gradient(transparent 0,#000 9%,#000 78%,transparent 96%)}
.lyrBox .lyr4::-webkit-scrollbar{display:none}
.lyrBox .lyrics-wrap{margin:0 auto}
.lyrBox .lline:not(.cur) .lword.done .ltext{color:rgba(255,255,255,.34)}
.lyrNow{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;height:44px;border:0;border-radius:22px;padding:0 18px 0 12px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 10px 30px rgba(14,6,32,.5);transition:opacity .2s ease,transform .2s ease;white-space:nowrap;cursor:pointer}
.lyrBox.free .lyrNow{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(min-width:900px){#app:has(.lyr4){max-width:none}.lyr4{padding:3vh 6vw}.lyrBox .lyr4{padding:30vh 6vw 55vh}.lyr4 .lword .ltext{font-size:clamp(26px,2.6vw,44px)}.lyr4 .lline.cur .lword .ltext{font-size:clamp(36px,4vw,72px)}.lyr4 .lyrics-wrap{max-width:none;gap:4vh}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:40px 24px;color:var(--muted)}
.empty h2{font-size:22px;font-weight:400;letter-spacing:-.01em;color:#fff;margin:0}
/* ---- Tabs: a floating pill ---- */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;height:68px;width:min(calc(100% - 28px),520px);border-radius:34px;background:rgba(42,18,80,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 40px rgba(14,6,32,.45);display:flex;align-items:center;justify-content:space-around;padding:0 8px}
#tabbar button{flex:1;max-width:84px;height:54px;border:0;border-radius:27px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.82)}
#tabbar button.on{color:#fff;background:rgba(255,255,255,.16)}
#tabbar button.on .msi{font-variation-settings:'FILL' 1}
#tabbar button span.lbl{font-size:11px;font-weight:600}
@media(max-height:520px) and (orientation:landscape){
  #tabbar{left:auto;right:calc(12px + env(safe-area-inset-right,0px));top:50%;bottom:auto;transform:translateY(-50%);width:72px;height:auto;flex-direction:column;padding:8px 0;gap:4px}
  #tabbar button{flex:none;width:54px;height:54px}
  #tabbar button span.lbl{display:none}
  #main{padding-bottom:20px;padding-right:90px}
  .lyr4 .lyrics-wrap{gap:14px}
  .lyrNow{bottom:16px}
}
.htitle{font-size:26px;font-weight:400;letter-spacing:-.02em;margin:0}
.hsub{font-size:12px;color:var(--muted)}
/* ---- Photos ---- */
.photogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:600px){.photogrid{grid-template-columns:repeat(3,1fr)}}
.phototile{position:relative;border-radius:18px;overflow:hidden;background:var(--s1);aspect-ratio:1}
.phototile img{width:100%;height:100%;object-fit:cover;display:block}
.phototile .by{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(26,14,56,.7);color:#fff;padding:3px 9px;border-radius:999px}
.phototile .dl{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(26,14,56,.7);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.fabPhoto{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);height:54px;padding:0 22px;border-radius:999px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(14,6,32,.5);z-index:20}
.fabPhoto:active{transform:translateX(-50%) scale(.97)}
/* ---- Chat ---- */
.chatRow{display:flex;flex-direction:column;gap:4px;max-width:80%}
.chatRow .who{font-size:11px;color:var(--muted);font-weight:700}
.chatRow .bub{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35}
.chatRow .dmtag{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
/* ---- Vote on what's next ---- */
.reqRow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.reqRow .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reqRow .s{font-size:12px;color:var(--muted);margin-top:2px}
.voteBtn{min-width:58px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.24);background:transparent;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;flex:none}
.voteBtn.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.voteBtn .msi{font-size:18px}
.voteBtn.on .msi{font-variation-settings:'FILL' 1}
.voteRow{margin-bottom:0;padding:10px 10px 10px 8px}
.voteRow.mine{border-color:rgba(243,184,255,.45);background:rgba(243,184,255,.1)}
.vpos{flex:none;width:28px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.vhelp{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.vnow{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:16px;border:1px dashed rgba(255,255,255,.22)}
.vnow .k{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.vnow .t{font-size:15px;font-weight:500}
.segm{display:flex;height:40px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:3px}
.segm button{flex:1;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;color:#fff}
.segm button.on{background:#fff;color:var(--ink);font-weight:700}
/* ---- Share overlay ---- */
#shareOverlay{position:fixed;inset:0;background:rgba(26,14,56,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:40;padding:40px 26px}
#shareOverlay img{width:240px;height:240px;border-radius:24px;background:#fff;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--ink);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:50;box-shadow:0 10px 30px rgba(14,6,32,.4)}
/* ---- TV / monitor ---- */
body.tv #app{max-width:none;min-height:100vh}
body.tv #head,body.tv #tabbarWrap{display:none}
body.tv #main{padding:0;overflow:hidden}
.tvw{flex:1;min-height:100vh;display:flex;flex-direction:column;padding:4.5vh 5vw 5vh;position:relative;overflow:hidden}
.tvw::before,.tvw::after{content:'';position:absolute;left:50%;top:50%;border-radius:50%;background:rgba(255,255,255,.028);pointer-events:none}
.tvw::before{width:140vh;height:140vh;margin:-70vh 0 0 -70vh}
.tvw::after{width:92vh;height:92vh;margin:-46vh 0 0 -46vh}
.tv-top{position:relative;display:flex;align-items:center;gap:2vw;font-size:clamp(14px,1.4vw,26px)}
.tv-brand{display:flex;align-items:center;gap:.6em;font-weight:700;font-size:1.4em;letter-spacing:-.02em}
.tv-mark{width:1.6em;height:1.6em;border-radius:.5em;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center}
.tv-sep{width:1px;height:1.6em;background:rgba(255,255,255,.2)}
.tv-song{display:flex;align-items:center;gap:.8em;min-width:0}
.tv-song .t{font-size:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-song .s{font-size:.8em;color:var(--muted)}
.tv-top .live{margin-left:auto;font-size:.75em}
.tv-prog{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:3vh;overflow:hidden}
.tv-prog>div{height:100%;background:var(--accent)}
.tv-lyrics{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.tv-lyrics .lyrics-wrap{max-width:none;gap:5vh}
.tv-lyrics .lword .ltext{font-size:clamp(24px,2.8vw,56px)}
.tv-lyrics .lline.cur .lword .ltext{font-size:clamp(36px,5.4vw,110px);letter-spacing:-.02em}
.tv-lyrics .lline.lheader{font-size:clamp(12px,1vw,18px);height:auto;padding:.4em 1em;border-radius:999px}
.tv-foot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:3vw;font-size:clamp(13px,1.2vw,22px)}
.tv-next .k{font-size:.8em;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.55)}
.tv-next .t{font-size:1.6em}
.tv-next .s{color:rgba(255,255,255,.6)}
.tv-cta{display:flex;align-items:center;gap:1.2em;border-radius:1.4em;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:.8em 1.4em .8em .8em}
.tv-cta img{width:7em;height:7em;border-radius:.7em;background:#fff;padding:.45em}
.tv-cta .t{font-size:1.35em;font-weight:500;letter-spacing:-.01em}
.tv-cta .s{color:rgba(255,255,255,.78)}
.tv-cta b{color:var(--accent);font-weight:500}
.tv-wait{position:relative;flex:1;display:flex;align-items:center;gap:6vw}
.tv-wait img{width:min(34vh,30vw);height:min(34vh,30vw);border-radius:2.2vh;background:#fff;padding:1.6vh;box-shadow:0 0 80px rgba(243,184,255,.35);flex:none}
.tv-wait h1{margin:0;font-size:clamp(40px,5.5vw,104px);font-weight:300;line-height:1.02;letter-spacing:-.03em}
.tv-wait .u{font-size:clamp(16px,1.7vw,32px);color:rgba(255,255,255,.78);margin-top:2vh}
.tv-wait .u b{color:var(--accent);font-weight:500}
.tv-card{margin-top:5vh;display:flex;align-items:center;gap:1.2em;border-radius:1.4em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:1em 1.4em;font-size:clamp(14px,1.3vw,24px)}
.tv-card .k{font-size:.8em;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.tv-card .t{font-size:1.6em}
@media (prefers-reduced-motion:reduce){ button{transition:none} }
</style>

</head>

<div id="app">
  <div id="head"></div>
  <div id="main"></div>
  <div id="tabbarWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.js"></script>
<script>
"use strict";
/* ============================================================
   Audience Guest Site — a no-login page guests reach by scanning a
   gig's QR code (see openQr/audienceUrl in the main app's
   singa-script-part1.js/part9.js). Built from the Audience Phone
   webapp design (dark/light toggle, Join screen, Lyrics/Requests/
   Photos/Chat tab bar, share-QR overlay). Guests have no account —
   each browser gets a random guest id + a name they type once,
   both kept in localStorage — so "who sent this" is self-reported,
   not authenticated; see the privacy note on gig_chat_messages in
   supabase-schema.sql for what that trade-off means for DMs.
   ============================================================ */
const sb = supabase.createClient(
  'https://xnzytiaixthfbmejltww.supabase.co',
  'sb_publishable_JTLPNLQNOHL3TmbS1MiGWg_rsX_QqmH'
);

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(name,size){ return `<span class="msi" style="font-size:${size||22}px">${name}</span>`; }
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return 'id'+Date.now()+Math.random().toString(16).slice(2); } }
function parseLyrics(text){ return (text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\s+/)); }
// a section heading: ((Chorus)), ((instrumental)), or the older [Verse 1] / (Chorus)
function isHeaderLine(ws){ if(!ws || !ws.length) return false; const t = ws.join(' ').trim();
  if(/^\(\(.*\)\)$/.test(t) || /^\[.*\]$/.test(t)) return true;
  return /^\([^()]*\)$/.test(t) && /^(intro|verse|pre-?chorus|chorus|post-?chorus|bridge|outro|hook|refrain|middle|instrumental|solo|interlude|break|coda|climb|capo|key|tempo|repeat)\b/i.test(t.slice(1,-1).trim()); }
function headLabel(ws){ const s = ws.join(' ').replace(/^[\[(]+\s*/,'').replace(/\s*[\])]+$/,'').replace(/\s*:.*$/,''); return s.charAt(0).toUpperCase()+s.slice(1); }
function timing(s){
  const lines = parseLyrics(s && s.lyrics); const words = [];
  // same x1 pace as the app: ~2.2 sung words a second + a breath per line
  let tt = 1;
  lines.forEach((ws,li)=>{ if(isHeaderLine(ws)) return; ws.forEach((w,wi)=>{ words.push({li,wi,t:tt}); tt += 0.45; }); tt += 1; });
  const realTs = s && s.word_timestamps;
  if(realTs && realTs.length===words.length){ words.forEach((w,i)=>{ if(typeof realTs[i]==='number' && isFinite(realTs[i])) w.t = realTs[i]; }); }
  const total = (s && typeof s.audio_duration_sec==='number') ? s.audio_duration_sec : (tt+1);
  return { lines, words, total };
}
// The song's tempo (set in the app): a recorded tempo highlights the words in
// time; a set speed (x0.5–x2.5, default x1) just scrolls the lyrics.
function songTempo(s){
  const t = (s && s.notes && s.notes._tempo) || {};
  const synced = !!(s && s.synced) && (t.mode ? t.mode==='synced' : true);
  return { synced, speed: synced ? 1 : (+t.speed || 1) };
}
// Artwork: a coloured square with two shapes, made from the name (the same
// name always gets the same picture — matches the performer app)
const N_ART = [['#F3B8FF','#6E1C78','#FFD8A8'],['#FFD8A8','#C2185B','#6E1C78'],['#9CC8FF','#2A1250','#FFD8A8'],['#FF9E9E','#6E1C78','#FFD8A8'],['#9FE3D2','#1A4D5C','#F3B8FF'],['#B9A6FF','#2A1250','#F3B8FF']];
function nHash(str){ let h = 2166136261; str = String(str||''); for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function nArt(seed, size, radius){
  const h = nHash(seed), p = N_ART[h % N_ART.length], v = (h>>>4) % 3, r = radius!=null ? radius : Math.round(size*0.28);
  let sh;
  if(v===0) sh = `<i style="right:-24%;bottom:-24%;width:82%;height:82%;background:${p[1]}"></i><i style="left:14%;top:14%;width:24%;height:24%;background:${p[2]}"></i>`;

// Where the song is right now (null when there are no lyrics to show)
function lyrNow(){
  if(ST.ended || !ST.live) return null;
  const live = ST.live, s = ST.songsById[live.songId];
  if(!s || live.vcd>0 || !s.lyrics || !s.lyrics.trim()) return null;
  const tm = timing(s), tempo = songTempo(s);
  // (the performer sends the state a few times a second; if that stops,
  //  the words stop too instead of running on by themselves)
  const elapsed = live.playing ? Math.min(performance.now() - ST.receivedAt, 2500) / 1000 * tempo.speed : 0;
  const t = Math.min(tm.total, (live.t||0) + elapsed);
  const ci = tempo.synced ? curWord(tm, t) : -1;
  const curLi = ci>=0 ? tm.words[ci].li : 0;
  const stale = live.playing && performance.now() - ST.receivedAt > 2500;
  const statusLine = live.listening ? 'Listening for the performer to start singing…' : (!live.playing || stale ? 'Paused' : '');
  return { live, s, tm, tempo, t, ci, curLi, sub: statusLine || s.sub || (live.playing?'Now playing':''), frac: Math.min(1, t/Math.max(1,tm.total)) };
}
function renderLyricsTab(){
  if(ST.ended){
    return `<div class="empty"><h2>This gig has ended</h2><div>Thanks for watching! Photos and chat are still here below.</div></div>`;
  }
  const live = ST.live;
  if(!live){
    const first = ST.gig.setlist && ST.gig.setlist.length ? ST.songsById[ST.gig.setlist[0]] : null;
    return `<div class="empty"><h2>Waiting for the performer…</h2><div>${first?('First up: '+esc(first.title||'Untitled song')):'The lyrics will appear here as soon as they start playing.'}</div></div>`;
  }
  const s = ST.songsById[live.songId];
  if(!s){ return `<div class="empty"><h2>Up next…</h2><div>The performer hasn't shared this song's lyrics yet.</div></div>`; }
  if(live.vcd>0){ return `<div class="empty"><h2>Starting in ${Math.max(1,Math.ceil(live.vcd))}…</h2></div>`; }
  if(!s.lyrics || !s.lyrics.trim()){ return `<div class="empty"><h2>No synced lyrics for this song yet</h2></div>`; }

  const N = lyrNow(), { tm, tempo, ci, curLi } = N;
  // the TV shows 4 lines at a time (the one before, the current one and the
  // next two); a guest's phone has the whole song to scroll through
  const first = Math.max(0, curLi-1);
  let k=-1;
  const html = tm.lines.map((ws,li)=>{
    const header = isHeaderLine(ws);
    let wordsHTML = '';
    if(!header) wordsHTML = ws.map((w,wi)=>{
      k++;
      // guests see the words only — no chords, no performer's markings
      const cls = !tempo.synced ? 'line' : (k===ci?'cur':(k<ci?'done':''));
      return `<div class="lword ${cls}" data-k="${k}"><div class="ltext">${esc(w)}</div></div>`;
    }).join('');
    if(TV && (li<first || li>=first+4)) return '';
    // a section label, without any chords written into it ("[Intro: C G]" → "Intro")
    // a run of ((instrumental)) lines shows its heading once
    if(header && li>0 && isHeaderLine(tm.lines[li-1]) && headLabel(tm.lines[li-1])===headLabel(ws)) return '';
    if(header) return `<div class="lline lheader" data-li="${li}">${esc(headLabel(ws))}</div>`;
    const curLine = li===curLi && tempo.synced;
    return `<div class="lline${curLine?' cur':''}" data-li="${li}" dir="auto">${wordsHTML}</div>`;
  }).join('');
  if(TV) return renderTvLyrics(s, html, N.frac);
  return `<div class="nowbar"><div style="min-width:0"><div class="t">${esc(s.title||'Untitled song')}</div><div class="s">${esc(N.sub)}</div></div></div>
    <div class="prog"><div style="width:${Math.round(N.frac*100)}%"></div></div>
    <div class="lyrBox${ST.lyrFree?' free':''}">
      <div class="lyr4" id="lyrScroll" data-song="${esc(live.songId)}" data-n="${tm.words.length}" data-ci="${ci}" data-li="${curLi}">
        <div class="lyrics-wrap">${html}</div>
      </div>
      <button class="lyrNow" data-act="lyrFollow">${icon('music_note',18)}Back to now</button>
    </div>`;
}
// While the song plays, update the words in place (so a guest's scrolling
// isn't interrupted) instead of drawing the page again. Returns false when
// the page needs a full render (another song, a new tab, …).
function patchLyrics(){
  if(TV || !ST.joined || ST.tab!=='lyrics') return false;
  const el = document.getElementById('lyrScroll'); if(!el) return false;
  const N = lyrNow(); if(!N) return false;
  if(el.dataset.song!==String(N.live.songId) || el.dataset.n!==String(N.tm.words.length)) return false;
  const main = document.getElementById('main');
  const sub = main.querySelector('.nowbar .s'); if(sub && sub.textContent!==N.sub) sub.textContent = N.sub;
  const bar = main.querySelector('.prog>div'); if(bar) bar.style.width = Math.round(N.frac*100)+'%';
  if(String(N.ci)!==el.dataset.ci){
    el.dataset.ci = N.ci;
    el.querySelectorAll('.lword').forEach(w=>{
      const k = +w.dataset.k, want = k===N.ci ? 'cur' : (k<N.ci ? 'done' : '');
      if(!w.classList.contains('line')){ w.classList.toggle('cur', want==='cur'); w.classList.toggle('done', want==='done'); }
    });
    if(String(N.curLi)!==el.dataset.li){
      el.dataset.li = N.curLi;
      el.querySelectorAll('.lline').forEach(l=> l.classList.toggle('cur', +l.dataset.li===N.curLi && N.tempo.synced && !l.classList.contains('lheader')));
      lyrScrollToCur(true);
    }
  }
  // a guest who scrolled away and then left it alone for a while is taken back
  if(ST.lyrFree && performance.now() - (ST.lyrUserAt||0) > 12000) ACTIONS.lyrFollow();
  return true;
}
function lyrScrollToCur(smooth){
  if(ST.lyrFree) return;
  const el = document.getElementById('lyrScroll'); if(!el) return;
  const line = el.querySelector('.lline.cur') || el.querySelector('.lline[data-li="'+el.dataset.li+'"]') || el.querySelector('.lline');
  if(!line) return;
  const top = Math.max(0, line.offsetTop + line.offsetHeight/2 - el.clientHeight*0.4);
  ST._lyrAutoAt = performance.now();
  el.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
}
// Scrolling by the guest (finger, wheel, keys, dragging the scrollbar) lets
// them read anywhere; the song's own scrolling doesn't count.
function bindLyrScroll(){
  const el = document.getElementById('lyrScroll'); if(!el || el._bound) return;
  el._bound = true;
  const box = el.parentNode;
  let touching = false, wheelAt = 0, keyAt = 0, mouseDown = false;
  el.addEventListener('touchstart', ()=>{ touching = true; }, { passive:true });
  el.addEventListener('touchend', ()=>{ touching = false; }, { passive:true });
  el.addEventListener('touchcancel', ()=>{ touching = false; }, { passive:true });
  el.addEventListener('wheel', ()=>{ wheelAt = performance.now(); }, { passive:true });
  el.addEventListener('keydown', ()=>{ keyAt = performance.now(); });
  el.addEventListener('mousedown', ()=>{ mouseDown = true; });
  window.addEventListener('mouseup', ()=>{ mouseDown = false; });
  el.addEventListener('scroll', ()=>{
    const now = performance.now();
    if(touching || mouseDown || now-wheelAt<400 || now-keyAt<700){
      ST.lyrUserAt = now;
      if(!ST.lyrFree){ ST.lyrFree = true; box.classList.add('free'); }
    }
  }, { passive:true });
}

async function loadRequests(){

// Voting on the order: one row per setlist song (id "v_<gig>_<song>");
// a guest's vote is their id in voter_ids.
function voteId(songId){ return 'v_'+gigId+'_'+songId; }
function voteRow(songId){ return ST.requests.find(x=>x.id===voteId(songId)) || null; }
function voteCount(songId){ const r = voteRow(songId); return r ? (r.voter_ids||[]).length || (+r.votes||0) : 0; }
function votedByMe(songId){ const r = voteRow(songId); return !!(r && (r.voter_ids||[]).includes(guestId)); }
// The songs still to come, in the order they'll be played: most votes first,
// then the setlist order (the performer's app sorts them the same way)
function upcomingIds(){
  const ids = (ST.gig && ST.gig.setlist) || [], live = ST.live;
  let up;
  if(live && Array.isArray(live.up)) up = live.up.filter(id=>ids.includes(id));
  else { const played = (live && live.played) || []; up = ids.filter(id=> id!==(live && live.songId) && !played.includes(id)); }
  if(!ST.settings.order) return up;
  return up.map((id,i)=>({ id, i: ids.indexOf(id), v: voteCount(id) })).sort((a,b)=> b.v-a.v || a.i-b.i).map(x=>x.id);
}
async function toggleVote(songId){
  if(!songId) return;
  const id = voteId(songId), s = ST.songsById[songId] || {};
  let r = voteRow(songId);
  if(!r){ r = { id, gig_id:gigId, title:s.title||'', sub:'', votes:0, voter_ids:[] }; ST.requests = [...ST.requests, r]; }
  const mine = (r.voter_ids||[]).includes(guestId);
  r.voter_ids = mine ? r.voter_ids.filter(x=>x!==guestId) : [...(r.voter_ids||[]), guestId];
  r.votes = r.voter_ids.length;
  render();
  try{
    // read the latest votes first, so other guests' votes aren't lost
    const cur = await sb.from('gig_requests').select('*').eq('id', id).maybeSingle();
    let voters = ((cur && cur.data && cur.data.voter_ids) || []).filter(x=>x!==guestId);
    if(!mine) voters.push(guestId);
    const res = (cur && cur.data)
      ? await sb.from('gig_requests').update({ votes:voters.length, voter_ids:voters }).eq('id', id)
      : await sb.from('gig_requests').insert({ id, gig_id:gigId, title:s.title||'', sub:'', votes:voters.length, voter_ids:voters });
    if(res && res.error){ console.error('Singa audience: vote failed', res.error); toast("Your vote didn't go through — try again"); }
    else { r.voter_ids = voters; r.votes = voters.length; render(); }
  }catch(e){ console.error('Singa audience: vote failed', e); toast("Your vote didn't go through — try again"); }
}
function renderRequestsTab(){
  const up = upcomingIds(), cur = ST.live && !ST.ended ? ST.songsById[ST.live.songId] : null;
  const rows = up.map((id,i)=>{
    const x = ST.songsById[id] || {}, n = voteCount(id), mine = votedByMe(id);
    return `<div class="reqRow voteRow${mine?' mine':''}"><span class="vpos">${i+1}</span><div style="flex:1;min-width:0"><div class="t">${esc(x.title||'Untitled song')}</div>${x.sub?`<div class="s">${esc(x.sub)}</div>`:''}</div>
      <button class="voteBtn ${mine?'on':''}" aria-pressed="${mine}" aria-label="${mine?'Take back your vote':'Vote'} for ${esc(x.title||'this song')} — ${n} vote${n===1?'':'s'}" data-act="toggleVote" data-id="${esc(id)}">${icon('favorite',18)}${n}</button></div>`;
  }).join('');
  return `<div class="pad" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0">
    <div><div class="hsub">${esc(ST.gig.title||'')}</div><h1 class="htitle">What's next?</h1><div class="vhelp">Vote for the songs you want to hear. The most votes are played first.</div></div>
    ${cur ? `<div class="vnow"><span class="k">NOW PLAYING</span><span class="t">${esc(cur.title||'Untitled song')}</span></div>` : ''}
    <div style="overflow:auto;flex:1;padding-top:2px;display:flex;flex-direction:column;gap:8px">${rows || `<div style="color:var(--muted);padding:16px 0">${ST.ended ? 'The gig has ended.' : 'No more songs on the setlist.'}</div>`}</div>
  </div>`;
}

  }).join('');
  return `<div class="pad" style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
    <div><div class="hsub">${esc(ST.gig.title||'')}</div><h1 class="htitle">Chat</h1></div>
    <div id="chatScroll" style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px">
      ${ST.chatLoading ? `<div style="color:var(--muted)">Loading…</div>` : (chatHTML || `<div style="color:var(--muted)">No messages yet — say hi.</div>`)}
    </div>
    <div style="display:flex;gap:8px">
      ${gs.dm ? `<button class="iconbtn" title="Message the band privately" data-act="toggleChatDM" style="height:46px;padding:0 12px;border-radius:23px;border:1px solid rgba(255,255,255,.24);background:${ST.chatDM?'#fff':'transparent'};color:${ST.chatDM?'var(--ink)':'#fff'};font-size:12px;font-weight:700;gap:4px">${icon('lock',18)}Band</button>` : ''}
      <input class="field" style="height:46px;border-radius:23px" placeholder="${ST.chatDM?'Message the band privately…':'Say something to everyone…'}" value="${esc(ST.chatDraft)}" data-bind="chatDraft" data-enter="sendChat">
      <button class="iconbtn" aria-label="Send" data-act="sendChat" style="width:46px;height:46px;border-radius:50%;background:#fff;color:var(--ink);flex:none">${icon('arrow_upward',22)}</button>
    </div>
  </div>`;
}

/* ============================================================
   TV / BIG SCREEN — the gig's lyrics for everyone in the room: no
   chords, no markings, the next song, and a QR code that sends people
   to the guest page to request what's next.
   ============================================================ */

const TV_MARK = `<span class="tv-mark" aria-hidden="true"><svg width="58%" height="58%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></span>`;
function tvNextSong(){
  const ids = (ST.gig && ST.gig.setlist) || [];
  if(!ST.live) return ids.length ? ST.songsById[upcomingIds()[0] || ids[0]] : null;
  const up = upcomingIds();
  return up.length ? ST.songsById[up[0]] : null;
}
function tvShortUrl(){ return guestUrl().replace(/^https?:\/\//,''); }
function tvCta(){
  ensureQr();
  return `<div class="tv-cta">${ST.qrDataUrl?`<img src="${ST.qrDataUrl}" alt="QR code for the guest page">`:''}<div><div class="t">Choose the next song</div><div class="s">Scan, or visit <b>${esc(tvShortUrl())}</b><br>to vote for the next song.</div></div></div>`;
}
function renderTvLyrics(s, linesHTML, frac){
  const nx = tvNextSong();
  return `<div class="tvw">
    <div class="tv-top"><span class="tv-brand">${N_WM}</span><span class="tv-sep"></span>
      <span class="tv-song"><span style="min-width:0"><div class="t">${esc(s.title||'Untitled song')}</div>${s.sub?`<div class="s">${esc(s.sub)}</div>`:''}</span></span>
      <span class="live">LIVE</span></div>
    <div class="tv-prog"><div style="width:${Math.round(Math.min(1,frac)*100)}%"></div></div>
    <div class="tv-lyrics"><div class="lyrics-wrap">${linesHTML}</div></div>
    <div class="tv-foot">${nx?`<div class="tv-next"><div class="k">UP NEXT</div><div class="t">${esc(nx.title||'Untitled song')}</div>${nx.sub?`<div class="s">${esc(nx.sub)}</div>`:''}</div>`:'<div></div>'}${tvCta()}</div>
  </div>`;
}
function renderTv(){
  if(!ST.ended && ST.live && ST.songsById[ST.live.songId] && !(ST.live.vcd>0)){
    const html = renderLyricsTab();
    if(html.indexOf('class="tvw"')>=0) return html;
  }
  ensureQr();
  const first = tvNextSong();
  const msg = ST.ended ? 'Thanks for singing along' : (ST.live && ST.live.vcd>0 ? 'Starting in '+Math.max(1,Math.ceil(ST.live.vcd))+'…' : 'Scan to<br>sing along');
  return `<div class="tvw">
    <div class="tv-top"><span class="tv-brand">${N_WM}</span><span style="margin-left:auto;color:var(--muted)">${esc(ST.gig.title||'')}</span></div>
    <div class="tv-wait">
      ${ST.qrDataUrl?`<img src="${ST.qrDataUrl}" alt="QR code for the guest page">`:''}
      <div style="min-width:0">
        <h1>${msg}</h1>
        <div class="u">or visit <b>${esc(tvShortUrl())}</b></div>
        ${first && !ST.ended ? `<div class="tv-card"><div><div class="k">${ST.live?'UP NEXT':'FIRST UP'}</div><div class="t">${esc(first.title||'Untitled song')}</div>${first.sub?`<div style="color:var(--muted)">${esc(first.sub)}</div>`:''}</div></div>` : ''}
        <div class="tv-card" style="margin-top:2vh;background:rgba(243,184,255,.14);border-color:rgba(243,184,255,.4)"><span class="msi" style="font-size:1.6em;color:var(--accent)">favorite</span><span>Vote for the songs you want to hear next. The most votes go first.</span></div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   TAB BAR + MAIN RENDER
   ============================================================ */
function renderSetlistTab(){
  const ids = (ST.gig && ST.gig.setlist) || [];
  const cur = ST.live && !ST.ended ? ST.live.songId : null;
  return `<div class="pad" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0">
    <div><div class="hsub">${esc(ST.gig.title||'')}</div><h1 class="htitle">Setlist</h1></div>
    <div style="overflow:auto;flex:1">
      ${ids.length ? ids.map((id,i)=>{ const x = ST.songsById[id] || {}; const on = id===cur;
        return `<div class="reqRow"><div style="flex:1"><div style="font-size:15px;font-weight:${on?800:600}">${esc(x.title||'Untitled song')}</div><div style="font-size:12px;color:${on?'var(--accent)':'var(--muted)'};margin-top:2px;font-weight:${on?700:400}">${on?'Now playing':esc(x.sub||'')}</div></div></div>`; }).join('')
        : `<div style="color:var(--muted);padding:16px 0">The setlist is empty.</div>`}
    </div>
  </div>`;
}
function tabList(){
  const gs = ST.settings;
  const t = [['lyrics','lyrics','Lyrics']];
  if(gs.browse) t.push(['setlist','format_list_numbered','Setlist']);
  if(gs.order) t.push(['requests','how_to_vote','Vote']);
  if(gs.photos) t.push(['photos','photo_library','Photos']);
  if(gs.chat) t.push(['chat','chat_bubble','Chat']);
  return t;
}
function renderTabbar(){
  if(!ST.joined) return '';
  const tabs = tabList();
  return `<div id="tabbar">${tabs.map(([v,ic,label])=>`<button class="${ST.tab===v?'on':''}"${ST.tab===v?' aria-current="page"':''} data-act="${v==='chat'?'openChatTab':'setTab'}" data-id="${v}">${icon(ic,22)}<span class="lbl">${label}</span></button>`).join('')}</div>`;
}
function renderMain(){
  if(ST.loading) return `<div class="empty"><h2>Loading…</h2></div>`;
  if(TV && !ST.notFoundReason) return renderTv();
  if(ST.notFoundReason) return `<div class="empty"><h2>${esc(ST.notFoundReason.title)}</h2><div>${esc(ST.notFoundReason.sub)}</div></div>`;
  if(!ST.joined) return renderJoin();
  if(ST.tab==='requests') return renderRequestsTab();
  if(ST.tab==='setlist') return renderSetlistTab();
  if(ST.tab==='photos') return renderPhotosTab();
  if(ST.tab==='chat') return renderChatTab();
  return renderLyricsTab();
}
function render(){
  document.getElementById('head').innerHTML = (ST.loading||ST.notFoundReason) ? `<span class="wordmark">${N_WM}</span>` : renderHead();
  const patched = patchLyrics();
  if(!patched){
    const prevEl = document.getElementById('lyrScroll');
    const prevSong = prevEl ? prevEl.dataset.song : null, prevTop = prevEl ? prevEl.scrollTop : 0;
    const main = document.getElementById('main'), fe = document.activeElement;
    const view = [ST.loading, ST.notFoundReason?1:0, ST.joined, ST.tab, ST.chatNameGate].join('|');
    if(fe && main.contains(fe) && /^(INPUT|TEXTAREA)$/.test(fe.tagName) && fe.type!=='file' && main.dataset.view===view){
      // someone is typing: redrawing would close their phone's keyboard, so
      // only the parts that change by themselves (the chat) are updated
      const tmp = document.createElement('div'); tmp.innerHTML = renderMain();
      ['chatScroll'].forEach(id=>{ const a = document.getElementById(id), b = tmp.querySelector('#'+id); if(a && b && a.innerHTML!==b.innerHTML) a.innerHTML = b.innerHTML; });
    } else { main.innerHTML = renderMain(); main.dataset.view = view; }
    const el = document.getElementById('lyrScroll');
    if(el){
      // a new song (or coming back to the tab) starts at the line being sung
      if(el.dataset.song!==prevSong){ ST.lyrFree = false; el.parentNode.classList.remove('free'); }
      bindLyrScroll();
      if(ST.lyrFree) el.scrollTop = prevTop; else lyrScrollToCur(false);
    }
  }
  document.getElementById('tabbarWrap').innerHTML = renderTabbar();
  if(ST.share) document.body.insertAdjacentHTML('beforeend', renderShareOverlay());
  else { const ov=document.getElementById('shareOverlay'); if(ov) ov.remove(); }
  if(ST.toast) document.body.insertAdjacentHTML('beforeend', `<div class="toast">${esc(ST.toast)}</div>`);
  else { document.querySelectorAll('.toast').forEach(t=>t.remove()); }
  bindInputs();
}
function bindInputs(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    const key = el.getAttribute('data-bind');
    el.oninput = ()=>{ ST[key]=el.value; };
    const enterAct = el.getAttribute('data-enter');
    if(enterAct) el.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); ACTIONS[enterAct](); } };
  });
  const pi = document.getElementById('photoInput');
  if(pi) pi.onchange = (e)=>{ const f=e.target.files && e.target.files[0]; if(f) uploadPhoto(f); e.target.value=''; };
}
document.body.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.getAttribute('data-act'); const id = t.getAttribute('data-id');
  if(ACTIONS[act]) ACTIONS[act](id);
});
document.body.addEventListener('click', e=>{
  if(e.target.id==='shareOverlay') { ST.share=false; render(); }
});

const ACTIONS = {
  toggleShare(){ ST.share=!ST.share; render(); },
  join(){ ST.name = ST.nameDraft.trim(); lsSet('singa_aud_name', ST.name); ST.joined=true; lsSet('singa_joined_'+gigId,'1'); ST.tab='lyrics'; render(); },
  setTab(id){ ST.tab=id; render(); },
  openChatTab,
  saveChatName,
  toggleVote,
  setReqSort(id){ ST.reqSort=id; render(); },
  lyrFollow(){ ST.lyrFree=false; const el=document.getElementById('lyrScroll'); if(el){ el.parentNode.classList.remove('free'); lyrScrollToCur(true); } },
  pickPhoto,
  toggleChatDM(){ ST.chatDM=!ST.chatDM; render(); },
  sendChat
};

/* ============================================================
   INIT + LIVE SYNC
   ============================================================ */
async function init(){
  if(TV){ document.body.classList.add('tv'); ST.joined = true; ST.tab = 'lyrics'; document.title = 'Singa — TV'; }
  if(!gigId){ ST.loading=false; ST.notFoundReason={ title:'No gig link', sub:'This link is missing a gig.' }; render(); return; }
  let gigRes;
  try{ gigRes = await sb.from('gigs').select('*').eq('id', gigId).eq('is_public', true).maybeSingle(); }
  catch(e){ ST.loading=false; ST.notFoundReason={ title:'Could not connect', sub:'Check your internet connection and reload.' }; render(); return; }
  if(gigRes.error || !gigRes.data){
    ST.loading=false; ST.notFoundReason={ title:"This gig isn't available", sub:"It may have been deleted, or the link/QR code is out of date — ask the performer for a fresh one." }; render(); return;
  }
  ST.gig = gigRes.data; ST.settings = gigSettings(ST.gig);
  if(ST.gig.setlist && ST.gig.setlist.length){
    try{
      const songsRes = await sb.from('songs').select('*').in('id', ST.gig.setlist);
      (songsRes.data||[]).forEach(row=>{ ST.songsById[row.id]=row; });
    }catch(e){ console.error('Singa audience: failed to load songs', e); }
  }
  ST.loading=false; render();

  loadRequests(); loadPhotos(); loadChat();

  // presence: each open guest page counts as one guest on the performer's
  // "N guests" indicator
  const channel = sb.channel('gig-live-'+gigId, { config: { presence: { key: guestId } } });
  channel.on('broadcast', { event:'state' }, msg=>{
    ST.live = msg.payload; ST.receivedAt = performance.now();
    if(ST.live.ended){ ST.ended=true; ST.live=null; }
    render();
  }).subscribe(status=>{
    // the TV isn't a guest, so it isn't counted
    if(status==='SUBSCRIBED' && !TV){ try{ channel.track({ role:'guest', name: ST.name||'' }); }catch(e){} }
  });

  const dataChannel = sb.channel('gig-data-'+gigId);
  dataChannel.on('postgres_changes', { event:'INSERT', schema:'public', table:'gig_chat_messages', filter:'gig_id=eq.'+gigId }, payload=>{
    const m = payload.new;
    if(m.is_dm && m.guest_id!==guestId) return;
    if(ST.chat.some(x=>x.id===m.id)) return;
    ST.chat=[...ST.chat, m]; render(); scrollChatToBottom();
  }).on('postgres_changes', { event:'INSERT', schema:'public', table:'gig_photos', filter:'gig_id=eq.'+gigId }, payload=>{
    const p = payload.new;
    if(ST.photos.some(x=>x.id===p.id)) return;
    ST.photos=[{ ...p, url: sb.storage.from('gig-photos').getPublicUrl(p.storage_path).data.publicUrl }, ...ST.photos]; render();
  }).on('postgres_changes', { event:'*', schema:'public', table:'gig_requests', filter:'gig_id=eq.'+gigId }, payload=>{
    if(payload.eventType==='INSERT'){ if(!ST.requests.some(x=>x.id===payload.new.id)) ST.requests=[...ST.requests, payload.new]; }
    else if(payload.eventType==='UPDATE'){ ST.requests = ST.requests.map(x=>x.id===payload.new.id?payload.new:x); }
    render();
  }).subscribe();

  setInterval(()=>{ if(ST.tab==='lyrics' && ST.live && ST.live.playing) render(); }, 150);
}

init();
</script>
