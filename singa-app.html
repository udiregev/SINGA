<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singa — Performer App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0..1,0" rel="stylesheet">
<style>
:root{
  --bg:#fff; --canvas:#ecebe8; --fg:#1b1b1b;
  --m1:#77756f; --m2:#8a8a8a; --m3:#6f6f6f; --m4:#9a9a9a;
  --accent:#f24822; --b1:#dcdad5; --b2:#ececec; --b3:#e6e6e6; --b4:#e2e2e2;
  --chordblue:#2f8fe0; --spotify:#1ed760; --youtube:#ff0000;
  --pad: clamp(16px, 4.5vw, 64px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas)}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--fg);text-decoration:none;cursor:pointer}
a:hover{color:var(--accent)}
input,textarea,button{font-family:inherit;color:inherit}
button{cursor:pointer;background:none}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-block;vertical-align:middle}
@keyframes singaIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes singaPop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes singaFade{from{opacity:0}to{opacity:1}}
@keyframes singaToast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

body.dark-invert{filter:invert(1) hue-rotate(180deg)}

#appRoot{min-height:100vh;display:flex;flex-direction:column;background:#fff}
#topbar{flex:none;height:64px;position:relative;display:flex;align-items:center;padding:0 24px}
#topbar .wordmark{position:absolute;left:0;right:0;text-align:center;font-family:'Source Serif 4',serif;font-weight:700;font-size:22px;pointer-events:none}
.darktoggle{display:flex;align-items:center;gap:8px;cursor:pointer;z-index:2}
.darktoggle .pill{width:40px;height:22px;border-radius:11px;border:1.5px solid var(--fg);position:relative;transition:background .25s}
.darktoggle .pill .dot{position:absolute;top:2px;width:15px;height:15px;border-radius:50%;transition:left .25s cubic-bezier(.2,.8,.2,1)}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scr{flex:1;min-height:0;padding:20px var(--pad) 40px;animation:singaIn .4s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column}
.scr.center{align-items:center}

/* buttons */
.btn{height:52px;border:0;border-radius:12px;font-size:15px;font-weight:600;transition:transform .15s,background .2s,color .2s,opacity .2s;padding:0 24px}
.btn:active{transform:scale(.96)}
.btn-dark{background:var(--fg);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--fg);color:var(--fg)}
.btn-accent{background:var(--accent);color:#fff}
.btn-grey{background:#dcdcdc;color:#444}
.btn-disabled{background:#d6d6d6;color:#fff;cursor:not-allowed}
.btn-sm{height:44px;padding:0 18px;font-size:14px}
.link{font-size:14px;font-weight:600;cursor:pointer}
.link-accent{color:var(--accent)}
.link-muted{color:var(--m3)}

input[type=text], input:not([type]), .ipt{height:54px;border:1.5px solid #d4d4d4;border-radius:12px;padding:0 18px;font-size:16px;outline:none;width:100%;background:#fff}
textarea.ipt{height:auto;padding:16px 18px;line-height:1.5;resize:none}

.row{display:flex;align-items:center}
.icon-btn{border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}

.seg{display:inline-flex;border:1.5px solid var(--fg);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;border-radius:7px;padding:8px 18px;font-size:14px;font-weight:600;background:transparent;color:var(--fg);transition:background .2s,color .2s}
.seg button.on{background:var(--fg);color:#fff}

.toggle{width:40px;height:22px;border-radius:11px;border:1.5px solid var(--fg);position:relative;flex:none;cursor:pointer;transition:background .25s}
.toggle .dot{position:absolute;top:2px;width:15px;height:15px;border-radius:50%;transition:left .25s cubic-bezier(.2,.8,.2,1)}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--b2);cursor:pointer;gap:12px}
.list-row .t{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.list-row .s{font-size:13px;color:var(--m2);margin-top:3px}
.chev{font-size:22px;color:var(--m2);flex:none}

.search-field{height:48px;border:1.5px solid var(--fg);border-radius:12px;display:flex;align-items:center;padding:0 6px 0 16px;gap:6px;min-width:0}
.search-field input{flex:1;min-width:0;border:0;outline:none;font-size:15px;background:transparent;height:100%}

.toast-box{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:200}
.toast{animation:singaToast .35s cubic-bezier(.2,.8,.2,1) both;background:var(--fg);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}

.modal-backdrop{position:fixed;inset:0;background:rgba(255,255,255,.82);animation:singaFade .25s ease both;display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal{width:100%;max-width:460px;border:1.5px solid var(--fg);border-radius:14px;background:#fff;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.12);animation:singaPop .32s cubic-bezier(.2,.8,.2,1) both;max-height:88vh;overflow:auto}
.modal .mhead{display:flex;justify-content:space-between;align-items:center}
.modal .mhead .ttl{font-size:21px;font-weight:600}
.modal .msub{font-size:13px;color:var(--m2)}

.qrgrid{display:grid;grid-template-columns:repeat(25,1fr);width:220px}
.qrgrid div{aspect-ratio:1}

/* chord diagram */
.diagram-row{display:flex;align-items:center;gap:26px;justify-content:center;flex-wrap:wrap}
.fretboard{position:relative;margin-top:18px}
.piano{position:relative;display:flex;height:92px;border:1.5px solid var(--fg);border-radius:4px;overflow:hidden}
.diaName{font-size:52px;font-weight:700;letter-spacing:-0.02em;min-width:70px}
.diaNext{font-size:24px;color:#b0b0b0}

/* lyric lines */
.lyrics-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.lline{position:relative;display:flex;flex-wrap:wrap;column-gap:7px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s ease,margin .5s cubic-bezier(.2,.8,.2,1)}
.lword{position:relative;display:flex;flex-direction:column;cursor:default}
.lword .lchord{height:18px;font-size:14px;font-weight:600;color:#9a9a9a}
.lword .ltext{font-size:24px;color:#333}
.markup,.markbefore,.markafter{position:absolute;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:4px}
.markup{bottom:100%;left:50%;transform:translateX(-50%);flex-direction:column;align-items:center}
.markbefore{right:100%;bottom:2px;margin-right:8px}
.markafter{left:100%;bottom:2px;margin-left:10px}
.markup .mtext,.markbefore .mtext,.markafter .mtext{font-family:Caveat,cursive;font-size:28px;line-height:1;color:var(--chordblue)}
.markup .mtext{font-size:26px}

/* responsive grids */
.home-grid{display:grid;grid-template-columns:1fr;gap:40px}
@media(min-width:760px){.home-grid{grid-template-columns:1fr 1fr;gap:56px}}
.gig-grid{display:grid;grid-template-columns:1fr;gap:28px}
@media(min-width:760px){.gig-grid{grid-template-columns:minmax(0,1fr) 150px;gap:40px}}
.gig-rail{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:24px;padding:12px 0}
@media(min-width:760px){.gig-rail{flex-direction:column;align-items:center;gap:28px;padding-top:4px}}
.gigplayer-grid{display:flex;flex-direction:column;flex:1;min-height:0}
@media(min-width:760px){.gigplayer-grid{display:grid;grid-template-columns:230px minmax(0,1fr)}}
.gigplayer-side{border-bottom:1px solid var(--b2);max-height:220px;overflow:auto;padding:16px 16px 16px 28px;display:flex;flex-direction:column}
@media(min-width:760px){.gigplayer-side{border-bottom:none;border-right:1px solid var(--b2);max-height:none;height:100%}}

.photogrid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:12px}
@media(min-width:600px){.photogrid{grid-template-columns:repeat(4,1fr);grid-auto-rows:170px}}
.phototile{border-radius:8px;background:repeating-linear-gradient(135deg,#e9e9e9 0 8px,#e1e1e1 8px 16px);display:flex;align-items:flex-end;padding:10px}
.phototile span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--m3)}

::placeholder{color:#a0a0a0}
</style>
</head>
<body>
<div id="appRoot">
  <div id="topbar">
    <span class="darktoggle" id="darkToggle" data-act="toggleDark" style="display:none">
      <span class="pill" id="darkPill"><span class="dot" id="darkDot"></span></span>
      <span class="msi" style="font-size:20px">light_mode</span>
    </span>
    <span class="wordmark">Singa</span>
  </div>
  <div id="screen"></div>
</div>
<div id="modalLayer"></div>
<div class="toast-box" id="toastBox"></div>
<input type="file" id="fileInput" accept="audio/*,video/*" style="display:none">
<script>
"use strict";
/* ============================================================
   DATA — ported verbatim from the authoritative design source
   ============================================================ */
const EX_LYRICS = "Don't go breaking my heart\nI couldn't if I tried\nHoney, if I get restless\nBaby, you're not that kind";
const EX_SUB = "Dolly Parton and the booland. Long version 2009";
const LETTERS = ['A','B','C','D','E','F','G'];
const ACC = { A:'Ab', B:'Bb', C:'C#', D:'Db', E:'Eb', F:'F#', G:'G#' };
const ROOTS = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const ALT = { Db:1, 'D#':3, Gb:6, 'G#':8, 'A#':10 };
const SUFFIXES = ['','m','7','m7','maj7','6','sus2','sus4','dim','aug','add9','9'];
const IV = { '':[0,4,7], m:[0,3,7], '7':[0,4,7,10], m7:[0,3,7,10], maj7:[0,4,7,11], '6':[0,4,7,9], sus2:[0,2,7], sus4:[0,5,7], dim:[0,3,6], aug:[0,4,8], add9:[0,4,7,14], '9':[0,4,7,10,14] };
const E_SHAPE = { '':[0,2,2,1,0,0], m:[0,2,2,0,0,0], '7':[0,2,0,1,0,0], m7:[0,2,0,0,0,0], maj7:[0,2,1,1,0,0], '6':[0,2,2,1,2,0], sus4:[0,2,2,2,0,0], '9':[0,2,0,1,0,2] };
const A_SHAPE = { '':[-1,0,2,2,2,0], m:[-1,0,2,2,1,0], '7':[-1,0,2,0,2,0], m7:[-1,0,2,0,1,0], maj7:[-1,0,2,1,2,0], '6':[-1,0,2,2,2,2], sus2:[-1,0,2,2,0,0], sus4:[-1,0,2,2,3,0], dim:[-1,0,1,2,1,-1], aug:[-1,0,3,2,2,1], add9:[-1,0,2,4,2,0], '9':[-1,0,2,4,2,3] };
const OPEN_GUITAR = { A:[-1,0,2,2,2,0], Am:[-1,0,2,2,1,0], A7:[-1,0,2,0,2,0], Am7:[-1,0,2,0,1,0], Asus2:[-1,0,2,2,0,0], Asus4:[-1,0,2,2,3,0], C:[-1,3,2,0,1,0], C7:[-1,3,2,3,1,0], Cmaj7:[-1,3,2,0,0,0], D:[-1,-1,0,2,3,2], Dm:[-1,-1,0,2,3,1], D7:[-1,-1,0,2,1,2], Dsus2:[-1,-1,0,2,3,0], Dsus4:[-1,-1,0,2,3,3], E:[0,2,2,1,0,0], Em:[0,2,2,0,0,0], E7:[0,2,0,1,0,0], Em7:[0,2,0,0,0,0], F:[1,3,3,2,1,1], G:[3,2,0,0,0,3], G7:[3,2,0,0,0,1] };
const OPEN_UKE = { C:[0,0,0,3], C7:[0,0,0,1], Cmaj7:[0,0,0,2], Am:[2,0,0,0], Am7:[0,0,0,0], A:[2,1,0,0], A7:[0,1,0,0], F:[2,0,1,0], G:[0,2,3,2], G7:[0,2,1,2], D:[2,2,2,0], Dm:[2,2,1,0], Em:[0,4,3,2], E7:[1,2,0,2] };
const WHITE = [0,2,4,5,7,9,11,12,14,16,17,19,21,23];
const BLACK = [[1,0],[3,1],[6,3],[8,4],[10,5],[13,7],[15,8],[18,10],[20,11],[22,12]];
const STAGES = ['Politely asking your voice to step away from the guitar','Teaching every word to keep up with you','Eavesdropping on the chords','Polishing the teleprompter'];
const DEMO_CHORDS = { '0-0':'Am','0-2':'F','0-4':'G','1-0':'Am','1-3':'G','2-0':'F','2-3':'G','3-0':'Am','3-2':'F' };
const SORTS = [['az','A → Z'],['za','Z → A'],['played','Most played'],['recent','Recently added'],['mine','Added by you']];
const INSTS = [['guitar','Guitar'],['piano','Piano'],['ukulele','Ukulele'],['none','No instrument']];

function freshData(){
  return {
    songs: {
      dgbmh:{ id:'dgbmh', title:"Don't Go Breaking My Heart", sub:EX_SUB, lyrics:EX_LYRICS, chords:{...DEMO_CHORDS}, notes:{'1-4':'Hi note','2-0':'Before','2-3':'Slide'}, synced:true, plays:42, added:5, mine:true, instrument:'guitar' },
      shp:{ id:'shp', title:'Shiny happy people', sub:'REM', lyrics:'', chords:{}, notes:{}, synced:false, plays:12, added:4, mine:true },
      nov:{ id:'nov', title:'November Rain', sub:"Guns 'n' Roses", lyrics:'', chords:{}, notes:{}, synced:false, plays:30, added:3, mine:false, by:'allhands232' },
      bo:{ id:'bo', title:'Bo', sub:'Wooho', lyrics:'', chords:{}, notes:{}, synced:false, plays:3, added:2, mine:true },
      angie:{ id:'angie', title:'Angie', sub:'Long version', lyrics:'', chords:{}, notes:{}, synced:false, plays:8, added:1, mine:true }
    },
    order: ['dgbmh','shp','nov','bo','angie'],
    playlists: [
      { id:'my', title:'My songs', auto:true, ids:[], mine:true, added:1, plays:60 },
      { id:'gnr', title:"Guns 'n' Roses", src:'spotify', ids:['nov'], mine:true, added:2, plays:14 },
      { id:'aff', title:'Affirmations', src:'youtube', ids:['bo','angie'], mine:false, by:'johnnyboy', added:3, plays:5 }
    ],
    gigs: [
      { id:'nye', title:"New year's eve party with Simon and Duncan", date:'Dec 31, 2026', setlist:['dgbmh','shp','nov','bo','angie'], plays:1, added:4, mine:true, settings:{} },
      { id:'anna', title:"Anna's Party, Monday May 2026", date:'May 4, 2026', setlist:['shp','nov','bo','angie'], plays:1, added:3, mine:true, settings:{} },
      { id:'john', title:"John's Cafe", date:'Every Thursday', setlist:['dgbmh','angie'], plays:22, added:2, mine:true, settings:{} },
      { id:'pride', title:'Pride weekend', date:'Jun 27, 2026', setlist:['shp','bo'], plays:2, added:1, mine:false, by:'Allan Jones', settings:{} }
    ],
    collabs: [ { name:'johnnyboy', email:'johnny@gmail.com', gigs:['anna'] }, { name:'Allan Jones', email:'allan@gmail.com', gigs:['nye','anna','john','pride'] } ],
    photos: [ {id:1,by:'Maya',span:1},{id:2,by:'Tom',span:1},{id:3,by:'Ezra',span:2},{id:4,by:'Lior',span:1},{id:5,by:'Maya',span:2},{id:6,by:'Sam',span:1} ]
  };
}

const EMPTY_SONG = { id:'none', title:'Untitled song', sub:'', lyrics:'', chords:{}, notes:{}, synced:false };
/* ============================================================
   STATE
   ============================================================ */
const D = freshData();
const ST = {
  screen:'login', back:'home', email:'',
  homeQuery:'', searchQuery:'', sort:'recent', sortOpen:false,
  listKind:'songs', listPl:null, listQuery:'',
  songId:'dgbmh', viewBy:null, viewChord:null, instrument:'guitar', menu:false, instMenu:false, chordH:230,
  startMode:'countdown', vcd:0,
  editId:null, createMode:'manual', step:'lyrics', similar:false, rootIdx:0, selRoot:'A', selSuffix:'m', selWord:null, noteDraft:'', autoChords:false,
  phase:'idle', cd:0, recT:0, bars:[], procPct:0, isPublic:false,
  t:0, playing:false, ctx:'view', guide:false, guideInst:'Piano',
  gigId:'nye', gigCur:null, played:[], orderVotes:{}, gListening:false, gigSettings:false,
  plan:'free', upgrade:false, collabFor:null, editList:null, qrOpen:false,
  collabEdit:null, newItem:null, pick:null, songPick:null, spQuery:'',
  notif:{req:true,photos:true,chat:false},
  perfDark:false, toast:null, sampling:false, sampleLeft:0, part:'Keys'
};
let toastTimer = null;

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(name, size){ return `<span class="msi" style="font-size:${size||24}px">${name}</span>`; }
function song(id){ return D.songs[id] || EMPTY_SONG; }
function gigObj(){ return D.gigs.find(g=>g.id===ST.gigId) || D.gigs[0]; }
function gigName(id){ return (D.gigs.find(g=>g.id===id)||{}).title || id; }
function toast(msg){
  ST.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ ST.toast=null; render(); }, 2200);
}
function parseLyrics(text){ return (text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\s+/)); }
function timing(s){
  const lines = parseLyrics(s && s.lyrics); const words = [];
  lines.forEach((ws,li)=>ws.forEach((w,wi)=>words.push({li,wi,t:1+li*4+wi*(3.2/ws.length)})));
  return { lines, words, total: 1+lines.length*4+1.5 };
}
function curWord(tm,t){ let i=-1; for(let k=0;k<tm.words.length;k++){ if(tm.words[k].t<=t) i=k; else break; } return i; }
function chordAt(s,tm,i){ let c=null; for(let k=0;k<=i&&k<tm.words.length;k++){ const w=tm.words[k]; const ch=s.chords[w.li+'-'+w.wi]; if(ch) c=ch; } return c; }
function chordSeq(s){ const tm=timing(s); const seq=[]; tm.words.forEach((w,k)=>{ const ch=s.chords[w.li+'-'+w.wi]; if(ch) seq.push({k,ch}); }); return seq; }
function fmtTime(x){ return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'); }

function parseChord(ch){ const m=/^([A-G][#b]?)(.*)$/.exec(ch||''); if(!m) return null; const r=ROOTS.indexOf(m[1]); return { r: r>=0?r:ALT[m[1]], q:m[2] }; }
function pianoSet(ch){ const p=parseChord(ch); if(!p) return []; return (IV[p.q]||IV['']).map(i=>{ let n=p.r+i; if(n>23) n-=12; return n; }); }
function guitarShape(ch){
  if(OPEN_GUITAR[ch]) return OPEN_GUITAR[ch];
  const p=parseChord(ch); if(!p) return [-1,-1,-1,-1,-1,-1];
  const q=IV[p.q]?p.q:'';
  const eOff=(p.r-4+12)%12, aOff=(p.r-9+12)%12;
  const useE = E_SHAPE[q] && (eOff<=aOff || !A_SHAPE[q]);
  const shape = useE?E_SHAPE[q]:A_SHAPE[q], off = useE?eOff:aOff;
  return shape.map(v=>v<0?-1:v+off);
}
function ukeShape(ch){
  if(OPEN_UKE[ch]) return OPEN_UKE[ch];
  const p=parseChord(ch); if(!p) return [-1,-1,-1,-1];
  const tones=(IV[p.q]||IV['']).map(i=>(p.r+i)%12), open=[7,0,4,9];
  let best=null, bs=-1e9;
  for(let b=0;b<=7;b++){
    const opts = open.map(o=>{ const a=[]; for(let f=b;f<=b+3;f++) if(tones.includes((o+f)%12)) a.push(f); return a; });
    if(opts.some(a=>!a.length)) continue;
    for(const a of opts[0]) for(const c of opts[1]) for(const d of opts[2]) for(const e of opts[3]){
      const fr=[a,c,d,e], pcs=new Set(fr.map((x,i)=>(open[i]+x)%12));
      if(!pcs.has(tones[0])) continue;
      const pos=fr.filter(x=>x>0), span = pos.length?Math.max(...pos)-Math.min(...pos):0;
      if(span>3) continue;
      const sc = pcs.size*100 - span*8 - fr.reduce((x,y)=>x+y,0)*2;
      if(sc>bs){ bs=sc; best=fr; }
    }
  }
  return best || [-1,-1,-1,-1];
}
function diagram(ch,next,inst){
  const base = { name: ch||'–', next: next||'–', isPiano:false, isGuitar:false };
  if(!ch || inst==='none') return base;
  if(inst==='piano'){
    const set = pianoSet(ch);
    return { ...base, isPiano:true,
      white: WHITE.map((s,i)=>({k:i,on:set.includes(s)})),
      black: BLACK.map(([s,i])=>({k:s,left:(i+1)*22-8,on:set.includes(s)})) };
  }
  const f = inst==='ukulele'?ukeShape(ch):guitarShape(ch), n=f.length;

function makeQr(seed){
  let x = seed; const rnd=()=>{ x=(x*9301+49297)%233280; return x/233280; };
  const N=25, out=[];
  const finder=(r,c,R,C)=>{ const a=r-R,b=c-C; if(a<0||b<0||a>6||b>6) return null; if(a===0||a===6||b===0||b===6) return 1; return (a>=2&&a<=4&&b>=2&&b<=4)?1:0; };
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    let v=finder(r,c,0,0); if(v===null) v=finder(r,c,0,18); if(v===null) v=finder(r,c,18,0);
    if(v===null){ const zone=(r<8&&c<8)||(r<8&&c>16)||(r>16&&c<8); v = zone?0:(rnd()>0.52?1:0); }
    out.push(v?'#111':'#fff');
  }

}

function buildLines(s, mode, opt){
  opt = opt || {};
  const tm = timing(s);
  const ci = opt.t!=null ? curWord(tm, opt.t) : -1;
  const cw = ci>=0 ? tm.words[ci] : null;
  let curChordK = -1; if(ci>=0) for(let k=0;k<=ci;k++){ const w=tm.words[k]; if(s.chords[w.li+'-'+w.wi]) curChordK=k; }
  const notes = { ...(s.notes||{}), ...(opt.extraNotes||{}) };
  const sel = ST.selRoot + ST.selSuffix;
  let g = 0;
  return tm.lines.map((ws,li)=>{
    const curLine = cw && cw.li===li, last = ws.length-1;
    let hasUp = false;
    const w2 = ws.map((w,wi)=>{
      const id = li+'-'+wi, ch = opt.hideChords ? '' : (s.chords[id]||''), gi = g++;
      const mark = notes[id] || '';
      const o = { id, w, chord:ch, col:'#333', chordCol:'#9a9a9a', weight:400, cursor:'default', mark,
        markBefore: !!mark && wi===0, markAfter: !!mark && wi===last && wi!==0, markUp: !!mark && wi>0 && wi<last };
      if(o.markUp) hasUp = true;
      if(mode==='chords'){
        o.col='#a3a3a3'; o.chordCol='#1b1b1b'; o.cursor='pointer'; o.clickAct='placeChord'; o.clickId=id;
      } else if(mode==='markings'){
        o.cursor='pointer'; o.clickAct='pickMarkWord'; o.clickId=id; o.selected = ST.selWord===id;
      } else if(mode==='view'){
        o.chordCol = ch && ch===opt.selChord ? '#f24822' : '#9a9a9a';
        if(ch){ o.cursor='pointer'; o.clickAct='setViewChord'; o.clickId=ch; }
      } else if(mode==='play'){
        const past = cw && li<cw.li;
        o.weight=700;
        o.col = curLine ? (gi<=ci?'#1b1b1b':'#b8b8b8') : (past?'#d2d2d2':'#a8a8a8');
        o.chordCol = gi===curChordK ? '#f24822' : (curLine?'#8a8a8a':'#cfcfcf');
      }
      return o;
    });
    const isPlay = mode==='play', on = isPlay && curLine;
    return { li, words:w2, padTop:(hasUp?30:0)+(on?10:0), mb: on?10:0, scale: on?1.12:1, op: isPlay && cw && li<cw.li ? 0.75:1, cur: on };
  });
}

    const words = l.words.map(w=>{

    }).join('');
    return `<div class="lline" style="${style}">${words}</div>`;
  }).join('') + `</div>`;

    </div>
    <div>
      <div style="font-size:21px;font-weight:700;margin-bottom:6px">Subscription</div>
      <div class="row" style="justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--b2)">
        <div><div class="row" style="gap:8px"><span style="font-size:16px;font-weight:700">${planName}</span><span style="font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:${planBadgeBg};color:${planBadgeCol}">CURRENT</span></div><div style="font-size:13px;color:#8a8a8a;margin-top:3px">${planSub}</div></div>
        ${ST.plan!=='rockstar'
          ? `<button class="btn btn-accent btn-sm" data-act="openUpgrade">${icon('bolt',20)}Upgrade to RockStar</button>`
          : `<a class="link link-muted" style="text-decoration:underline" data-act="downgrade">Switch to Free</a>`}
      </div>
    </div>
    <div>
      <div style="font-size:21px;font-weight:700;margin-bottom:6px">Collaborators</div>
      ${collabRows}
      <a class="link" style="display:inline-flex;align-items:center;gap:6px;margin-top:12px" data-act="newCollab">${icon('person_add',20)}Add collaborator</a>

    <div>
      <div style="font-size:21px;font-weight:700;margin-bottom:6px">Start playback with</div>

        <button class="${ST.startMode==='countdown'?'on':''}" data-act="setStartMode" data-id="countdown">Countdown</button>

}

function renderCollab(){
  const cg = ST.collabFor ? D.gigs.find(g=>g.id===ST.collabFor) : null;
  const rows = D.collabs.map((c,i)=>{
    const inGig = cg && c.gigs.includes(cg.id);

      <div><div style="font-size:16px;font-weight:600">${esc(c.name)}</div><div style="font-size:13px;color:#8a8a8a;margin-top:4px">${esc(c.gigs.map(gigName).join(' · ') || 'No gigs yet')}</div></div>
      <span class="icon-btn" data-act="editCollab" data-id="${i}">${icon('edit',22)}</span>

    <div class="row" style="gap:14px">
      <span class="icon-btn" data-act="back" data-to="${esc(ST.back)}">${icon('chevron_left',26)}</span>
      <div><div style="font-size:28px;font-weight:700">Collaborators</div>${cg?`<div style="font-size:14px;color:#6f6f6f;margin-top:4px">Tap + to add someone to ${esc(cg.title)}</div>`:''}</div>
      <div style="flex:1"></div>
      <span class="icon-btn" title="Add collaborator" data-act="newCollab">${icon('person_add',26)}</span>
    </div>
    <div>${rows}</div>

/* ============================================================
   SCREEN: Create Song (Manual / From Recording / From File)
   ============================================================ */
function confirmFootnote(){
  return `<div style="text-align:center;font-size:12px;color:#8a8a8a">You hereby confirm that you have permission to reproduce these lyrics</div>`;
}
function processingBlock(){
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:40px">
    <div style="font-size:22px;font-weight:700">Applying magic…</div>
    <div style="width:300px;height:8px;border-radius:4px;background:#e6e6e6;overflow:hidden"><div style="height:100%;width:${Math.round(ST.procPct)}%;background:#1b1b1b;border-radius:4px"></div></div>
    <div style="font-size:14px;color:#6f6f6f">${STAGES[Math.min(3,Math.floor(ST.procPct/25))]}</div>
  </div>`;
}
function waveformBlock(){
  const bars = (ST.bars.length?ST.bars:[20,40,30]).slice(-18);
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:28px">
    <div style="display:flex;align-items:center;gap:5px;height:96px">
      ${bars.map(h=>`<div style="width:6px;border-radius:3px;background:#1b1b1b;height:${h}px"></div>`).join('')}
      <div style="width:2px;height:96px;background:#f24822;margin:0 6px"></div>
      ${[0,1,2,3,4,5,6,7,8].map(()=>`<div style="width:6px;height:6px;border-radius:50%;background:#1b1b1b"></div>`).join('')}
    </div>
    <div style="font-size:14px;color:#6f6f6f;font-variant-numeric:tabular-nums">${fmtTime(ST.recT)}</div>
    <div class="row" style="gap:12px">
      <button class="btn btn-accent" style="width:150px" data-act="stopRecord">Stop</button>
      <button class="btn btn-outline" style="width:150px" data-act="abortRecord">Abort</button>
    </div>
  </div>`;
}
function countdownBlock(){
  return `<div style="position:relative;top:40px;display:flex;justify-content:center;font-size:160px;font-weight:800;line-height:1">${Math.max(1,Math.ceil(ST.cd))}</div>`;
}

function renderManualLyrics(d){
  const hasLyrics = !!d.lyrics.trim();
  return `<div style="width:100%;flex:1;display:flex;flex-direction:column;gap:14px;margin-top:28px;max-width:640px;margin-left:auto;margin-right:auto">
    <div class="row" style="gap:14px">
      <input class="ipt" style="height:64px;font-size:18px;font-weight:600" placeholder="Title" value="${esc(d.title)}" data-bind="draftTitle">
      <button class="icon-btn" title="Find similar titles" style="width:48px;height:48px" data-act="openSimilar">${icon('search',26)}</button>
    </div>
    <input class="ipt" style="height:64px" placeholder="Sub title — artist, version" value="${esc(d.sub)}" data-bind="draftSub">
    <textarea class="ipt" style="min-height:300px;font-size:18px" placeholder="Type or paste lyrics, one line per row" data-bind="draftLyrics">${esc(d.lyrics)}</textarea>
    ${!hasLyrics?`<a class="link" style="text-decoration:underline;align-self:flex-start" data-act="fillExample">Paste example lyrics</a>`:''}
    ${confirmFootnote()}
    <button class="btn ${hasLyrics?'btn-dark':'btn-disabled'}" style="align-self:center;width:170px;height:48px" data-act="lyricsNext">Next</button>
  </div>`;
}

function renderChordWheel(){
  const roots = LETTERS.map((r,i)=>`<div style="flex:none;width:100px;height:72px;display:flex;align-items:center;justify-content:center;font-size:${i===ST.rootIdx?44:26}px;font-weight:700;color:${i===ST.rootIdx?'#1b1b1b':'#a8a8a8'};cursor:pointer" data-act="pickRoot" data-id="${i}">${r}</div>`).join('');
  const letter = LETTERS[ST.rootIdx];
  const variants = [letter, ACC[letter]].flatMap(rt => SUFFIXES.map(q=>{
    const on = rt===ST.selRoot && q===ST.selSuffix;
    return `<button style="height:48px;border-radius:12px;border:1.5px solid var(--fg);background:${on?'#1b1b1b':'#fff'};color:${on?'#fff':'#1b1b1b'};font-size:17px;font-weight:700" data-act="pickVariant" data-root="${rt}" data-q="${q}">${rt}${q}</button>`;
  })).join('');
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px">
    <div style="font-size:13px;color:#6f6f6f">Pick a chord, then tap a word to place it. Tap again to remove.</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div style="position:relative;width:300px;height:72px">
        <div style="position:absolute;left:100px;top:0;width:100px;height:72px;border-radius:14px;background:#f2f2f2"></div>
        <div style="position:relative;width:300px;height:72px;overflow-x:auto;overflow-y:hidden;display:flex;mask-image:linear-gradient(90deg,transparent 0,#000 24%,#000 76%,transparent 100%)">
          <div style="flex:none;width:100px"></div>${roots}<div style="flex:none;width:100px"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,76px);gap:6px;max-width:580px;grid-template-columns:repeat(auto-fit,76px);justify-content:center">${variants}</div>
    </div>
    <a class="link" style="text-decoration:underline" data-act="detectChords">Detect chords from a recording instead</a>
  </div>`;
}

function renderNoteEditor(d){
  if(ST.selWord==null) return '';
  const [li, wi] = ST.selWord.split('-').map(Number);
  const ws = parseLyrics(d.lyrics)[li] || [];
  const w = ws[wi] || '';
  const placement = wi===0 ? 'Shown before the line' : (wi===ws.length-1 ? 'Shown after the line' : 'Shown above the word, with an arrow');
  return `<div style="margin-top:28px;width:100%;max-width:440px;border:1.5px solid #2f8fe0;border-radius:12px;background:#f3f8ff;padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="font-size:13px;font-weight:600;color:#2f8fe0">Mark on "${esc(w)}"</div>
    <input class="ipt" style="height:44px;border:1px solid #cfe0f5;font-family:Caveat,cursive;font-size:24px;color:#2f8fe0;background:#fff" placeholder="e.g. Hi note, breathe, key change" value="${esc(ST.noteDraft)}" data-bind="noteDraft">
    <div class="row" style="gap:8px">
      <span style="font-size:12px;color:#6f6f6f">${placement}</span>
      <div style="flex:1"></div>
      <a class="link link-accent" data-act="removeNote">Remove</a>
      <button class="btn btn-dark btn-sm" data-act="saveNote">Save</button>
    </div>
  </div>`;
}

function renderSongBody(d){
  const editMode = ST.step==='chords' ? 'chords' : ST.step==='markings' ? 'markings' : 'static';
  const lines = buildLines(d, editMode, ST.phase==='recording' ? {t:ST.recT} : null);
  const opacity = (ST.phase==='countdown'||ST.phase==='processing') ? 0.12 : 1;
  return `<div style="width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;margin-top:24px;position:relative">
    <div style="opacity:${opacity};display:flex;flex-direction:column;align-items:center;width:100%;overflow:auto;padding-bottom:16px">
      <div style="font-size:40px;font-weight:800;letter-spacing:-0.02em;text-align:center">${esc(d.title||'Untitled song')}</div>
      <div style="font-size:15px;color:#6f6f6f;margin-top:6px">${esc(d.sub)}</div>
      ${ST.step==='chords' ? renderChordWheel() : ''}
      ${ST.step==='markings' ? `<div style="font-size:13px;color:#6f6f6f;margin-top:26px">Tap a word to add a mark. Marks on the first or last word sit beside the line; others point at the word.</div>` : ''}
      <div style="margin-top:34px">${linesHTML(lines)}</div>
    </div>
    ${ST.step==='markings' ? renderNoteEditor(d) : ''}
    ${ST.phase==='countdown' ? `<div style="position:absolute;top:60px;left:0;right:0">${countdownBlock()}</div>` : ''}
    ${ST.phase==='processing' ? `<div style="position:absolute;top:60px;left:0;right:0">${processingBlock()}</div>` : ''}
    ${(ST.step==='chords'||ST.step==='markings') ? `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px;border-top:1px solid #f0f0f0;width:100%;margin-top:20px">
        <div style="font-size:12px;color:#8a8a8a">You hereby confirm that you have permission to reproduce these lyrics</div>
        <button class="btn btn-dark" style="width:170px" data-act="createNextStep">Next</button>
        <a class="link" style="color:#9a9a9a" data-act="createNextStep">Skip</a>
      </div>` : ''}
    ${ST.step==='sync' && ST.phase==='idle' ? `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:340px;margin:0 auto">
        ${ST.autoChords?`<div style="font-size:13px;color:#2f8fe0;text-align:center;margin-bottom:6px">Chords will be detected from the instruments in your recording.</div>`:''}
        <button class="btn btn-grey" style="width:100%" data-act="practiceDraft">Practice</button>
        <button class="btn btn-accent" style="width:100%" data-act="startRecord">Record</button>
        <a class="link" style="text-decoration:underline;margin-top:4px" data-act="startUpload">Upload</a>
        <div style="font-size:12px;color:#8a8a8a;text-align:center">Sing and play it once. Singa isolates your vocal, aligns every word and detects the chords.</div>
      </div>` : ''}
    ${ST.step==='sync' && (ST.phase==='countdown'||ST.phase==='recording') ? waveformBlock() : ''}
  </div>`;
}

function renderSimilarModal(){
  const rows = [
    {title:"Don't Go Breaking My Heart", sub:'Dolly Parton', by:'joesnow'},
    {title:"Don't Go Breaking My Heart", sub:'Dolly Parton & Rick Stein', by:'allhands232'}
  ];
  return `<div class="modal-backdrop" data-act="closeSimilar" style="align-items:flex-start;padding-top:140px">
    <div class="modal" style="max-width:420px" onclick="event.stopPropagation()">
      <div class="mhead"><span style="font-size:15px;font-weight:700">Similar titles</span><span class="icon-btn" data-act="closeSimilar">${icon('close',22)}</span></div>
      <div class="msub">Already on Singa. Copy one instead of starting from scratch.</div>
      ${rows.map((r,i)=>`<div class="list-row" style="padding:12px 14px;border:1px solid #ececec;border-radius:10px" data-act="useSimilar" data-id="${i}"><div><div style="font-size:15px;font-weight:600">${esc(r.title)}</div><div style="font-size:12px;color:#8a8a8a;margin-top:2px">${esc(r.sub)} · added by ${esc(r.by)}</div></div>${icon('chevron_right',22)}</div>`).join('')}
      <button class="btn btn-dark" style="margin-top:8px" data-act="closeSimilar">Keep creating my own</button>
    </div>
  </div>`;
}

function renderCreate(){
  const d = D.songs[ST.editId] || { id:'x', title:'', sub:'', lyrics:'', chords:{}, notes:{} };
  const phaseIdle = ST.phase==='idle';
  const modeLocked = !phaseIdle || (ST.createMode==='manual' && ST.step!=='lyrics');
  const modes = [['manual','Manual'],['recording','From Recording'],['file','From File']];
  const modeSeg = `<div class="seg" style="opacity:${modeLocked?0.4:1};border-color:${modeLocked?'#bdbdbd':'#1b1b1b'}">
    ${modes.map(([v,l])=>`<button class="${v===ST.createMode?'on':''}" ${modeLocked?'':`data-act="setCreateMode" data-id="${v}"`}>${l}</button>`).join('')}
  </div>`;
  const hasLyrics = !!d.lyrics.trim();
  const stepTabs = ['lyrics','chords','markings','sync'];
  const isManual = ST.createMode==='manual';
  const stepTabsHTML = isManual ? `<div style="display:flex;border-bottom:1.5px solid #e2e2e2">
    ${stepTabs.map(k=>`<button style="border:0;background:transparent;width:104px;height:42px;font-size:15px;font-weight:${k===ST.step?700:500};color:${k===ST.step?'#1b1b1b':(hasLyrics||k==='lyrics'?'#8a8a8a':'#c8c8c8')};border-bottom:2.5px solid ${k===ST.step?'#1b1b1b':'transparent'};margin-bottom:-1.5px" data-act="goCreateStep" data-id="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}
  </div>` : '';

  let body = '';
  if(isManual && ST.step==='lyrics'){
    body = renderManualLyrics(d);
  } else if(isManual){
    body = renderSongBody(d);
  } else if(ST.createMode==='recording'){
    if(phaseIdle){
      body = `<div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:28px;margin-top:40px;max-width:420px;margin-left:auto;margin-right:auto">
        <input class="ipt" placeholder="Song title" value="${esc(d.title)}" data-bind="draftTitle">
        <div class="row" style="gap:22px;margin-top:40px">
          <button class="btn btn-accent" style="width:150px" data-act="startRecord">Record</button>
          <a class="link" style="text-decoration:underline" data-act="startUpload">Upload</a>
        </div>
        <div style="font-size:13px;color:#6f6f6f;text-align:center;max-width:420px;line-height:1.5">No lyrics needed. Singa transcribes your words and detects the chords from the recording. You can correct them afterwards.</div>
        <div style="font-size:12px;color:#8a8a8a">You hereby confirm that you have permission to reproduce these lyrics</div>
      </div>`;
    } else {
      body = `<div style="width:100%;flex:1;display:flex;flex-direction:column;align-items:center;gap:40px;margin-top:80px">
        <div style="font-size:40px;font-weight:800;letter-spacing:-0.02em;color:${ST.phase==='countdown'?'#d0d0d0':'#1b1b1b'}">${esc(d.title||'Untitled song')}</div>
        ${ST.phase==='countdown'?countdownBlock():''}
        ${ST.phase==='recording'?waveformBlock():''}
        ${ST.phase==='processing'?processingBlock():''}
      </div>`;
    }
  } else if(ST.createMode==='file'){
    if(phaseIdle){
      body = `<div style="display:flex;flex-direction:column;align-items:center;gap:28px;margin-top:80px">
        <div class="row" style="gap:28px">
          <button class="btn-outline" style="width:170px;height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px" data-act="startUpload">${icon('upload',36)}<span style="font-size:15px;font-weight:600">Upload</span></button>
          <button class="btn-outline" style="width:170px;height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px" data-act="startCloud">${icon('cloud',36)}<span style="font-size:15px;font-weight:600">Link Cloud</span></button>
        </div>
        <div style="font-size:13px;color:#6f6f6f">Audio or video of you performing the song.</div>
        <div style="font-size:12px;color:#8a8a8a">You hereby confirm that you have permission to reproduce these lyrics</div>
      </div>`;
    } else {
      body = `<div style="margin-top:120px">${processingBlock()}</div>`;
    }
  }

  return `<div class="scr center" style="padding-top:16px">
    ${modeSeg}
    <div style="width:100%;display:flex;align-items:center;margin-top:20px;min-height:44px;max-width:760px">
      <span class="icon-btn" data-act="createBack">${icon('chevron_left',26)}</span>
      <div style="flex:1;display:flex;justify-content:center">${stepTabsHTML}</div>
      <span style="width:26px"></span>
    </div>
    ${body}
  </div>${ST.similar?renderSimilarModal():''}`;
}
/* ============================================================
   SCREENS: Completion / Incomplete / Song Viewer (+menu)
   ============================================================ */

  return `<div class="scr center" style="padding-top:20px">

    <div style="font-size:64px;font-weight:800;letter-spacing:-0.03em;margin-top:12px">Congrats!</div>
    <div style="font-size:22px;text-align:center;line-height:1.4;margin-top:4px">${esc(d.title||'Your song')}<br>was added</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px">
      <a class="link link-muted" data-act="openPicker" data-kind="playlist">Add to playlist</a>
      <a class="link link-muted" data-act="openPicker" data-kind="gig">Add to a gig</a>
      <a class="link" style="color:${ST.isPublic?'#1b1b1b':'#6f6f6f'}" data-act="togglePublic">${ST.isPublic?'Public · anyone can copy it':'Make publicly available'}</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:30px">
      <button class="btn btn-grey" style="height:64px" data-act="viewDone">View Song</button>
      <button class="btn btn-dark" style="height:64px" data-act="newSong">Add New Song</button>
    </div>
  </div>`;
}

function renderSong(){
  const s = song(ST.songId);
  const inst = ST.instrument, hasInst = inst!=='none';
  const seq = chordSeq(s);
  const vtm = timing(s);
  const vLive = ST.playing || ST.t>0;
  const vci = curWord(vtm, ST.t);
  let diaChord, diaNext;
  if(vLive){ diaChord = chordAt(s,vtm,Math.max(vci,0)) || (seq[0]||{}).ch; diaNext = (seq.find(x=>x.k>vci && x.ch!==diaChord)||{}).ch; }
  else { diaChord = ST.viewChord || (seq[0]&&seq[0].ch); const vi = seq.findIndex(x=>x.ch===diaChord); diaNext = seq[vi+1] ? seq[vi+1].ch : (seq[0]&&seq[0].ch); }
  const dia = diagram(diaChord, diaNext, inst);
  const lines = buildLines(s, vLive?'play':'view', { t: vLive?ST.t:null, selChord: diaChord, hideChords: !hasInst });
  const vPlaying = ST.playing;
  const chordScale = Math.max(0.55, Math.min(1.9, ST.chordH/230));
  return `<div class="scr" style="padding-bottom:0">
    <div class="row" style="gap:14px;align-items:flex-start">
      <span class="icon-btn" style="margin-top:4px" data-act="back" data-to="${esc(ST.back)}">${icon('chevron_left',26)}</span>
      <div style="flex:1">
        <div style="font-size:28px;font-weight:700;letter-spacing:-0.01em">${esc(s.title||'Untitled song')}</div>
        <div style="font-size:14px;color:#6f6f6f;margin-top:4px">${esc(s.sub)}</div>
        ${ST.viewBy?`<div class="row" style="gap:6px;font-size:13px;margin-top:8px">${icon('account_circle',18)}added by ${esc(ST.viewBy)}</div>`:''}
      </div>
      <span class="icon-btn" data-act="toggleMenu">${icon('menu',28)}</span>
    </div>
    ${ST.viewBy?`<button class="btn btn-dark btn-sm" style="align-self:flex-start;margin:18px 0 0 40px" data-act="copySong">Copy to your playlist</button>`:''}
    ${hasInst?`<div style="height:${Math.round(ST.chordH)}px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;transform:scale(${chordScale})">
          ${diagramHTML(dia)}
          <button class="link" style="display:flex;align-items:center;gap:6px" data-act="playSample">${icon(ST.sampling?'stop_circle':'play_circle',22)}${ST.sampling?'Stop sample · '+Math.ceil(ST.sampleLeft)+'s':'Play Sample'}</button>
        </div>
      </div>
      <div class="row" style="justify-content:center;cursor:ns-resize;height:30px" title="Drag to resize">${icon('drag_handle',26)}</div>`:''}
    <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:20px 0 40%" id="lyricsScroll">
      ${linesHTML(lines)}
    </div>
    <div style="flex:none;min-height:92px;display:flex;align-items:center;justify-content:center;padding:10px 0">
      ${ST.startMode==='countdown'
        ? `<button class="icon-btn" title="Play" style="width:68px;height:68px;border-radius:50%;background:#1b1b1b;color:#fff" data-act="viewPlay">${icon(vPlaying?'pause':'play_arrow',38)}</button>`
        : `<div class="row" style="gap:12px;cursor:pointer;max-width:520px" data-act="viewPlay">${icon('mic',30)}<div><div style="font-size:16px;font-weight:600">${vPlaying?'Following your voice':"I'm listening. Playback will start playing when you start singing."}</div><div style="font-size:12px;color:#8a8a8a;margin-top:3px">${vPlaying?'Tap to pause':'Prototype: tap here to simulate singing'}</div></div></div>`}
    </div>
  </div>
  ${ST.vcd>0?`<div class="modal-backdrop" style="background:rgba(255,255,255,.75);font-size:180px;font-weight:800">${Math.max(1,Math.ceil(ST.vcd))}</div>`:''}
  ${ST.menu?renderSongMenu():''}`;
}

/* ---- Gig Player ---- */
function queueFor(g){
  const gs = gigSettings(g);
  const played = ST.played.filter(id=>g.setlist.includes(id));
  const rest = g.setlist.filter(id=>!played.includes(id));
  const cur = ST.gigCur && rest.includes(ST.gigCur) ? ST.gigCur : null;
  let up = rest.filter(id=>id!==cur);
  if(gs.order) up = up.map((id,i)=>({id,i,v:ST.orderVotes[id]||0})).sort((a,b)=>b.v-a.v||a.i-b.i).map(x=>x.id);
  const cued = cur || up[0] || null;
  if(!cur && cued) up = up.slice(1);
  return { played, cued, up };
}
function gigSongId(){ const q = queueFor(gigObj()); return q.cued || gigObj().setlist[0]; }
function openPlayer(id){
  const g = gigObj(); const fresh = ST._liveGig !== g.id;
  ST.screen='gigplayer'; ST.ctx='gig'; ST._liveGig=g.id;
  ST.gigCur = id || (fresh ? null : ST.gigCur);
  ST.played = fresh ? [] : (id ? ST.played.filter(x=>x!==id) : ST.played);
  ST.t=0; ST.playing=false; ST.vcd=0; ST.gListening=false;
}

function renderGigPlayer(){
  const g = gigObj();
  const gq = queueFor(g), gs = gigSettings(g);
  const isCollab = !g.mine;
  const gStarted = ST.playing || ST.t>0;
  const curId = gigSongId();
  const s = song(curId);
  const tm = timing(s);
  const ci = curWord(tm, ST.t);
  const seq = chordSeq(s);
  const chord = chordAt(s,tm,Math.max(ci,0)) || (seq[0]||{}).ch;
  const next = (seq.find(x=>x.k>ci && x.ch!==chord)||{}).ch;
  const hasInst = ST.instrument!=='none';
  const gigShowChords = hasInst || isCollab;
  const dia = diagram(chord, next || (seq[0]||{}).ch, isCollab ? (ST.part==='Keys'?'piano':'guitar') : ST.instrument);
  const gigHasLyrics = !!(s.lyrics && s.lyrics.trim());
  const lines = gigHasLyrics ? buildLines(s, gStarted?'play':'view', { t: gStarted?ST.t:null, selChord: chord, hideChords: !isCollab && !hasInst }) : [];

  const qRow = (id, kind) => {
    const x = song(id), isCur = kind==='cur';
    const tag = isCur ? (ST.playing?'NOW PLAYING':(gStarted?'PAUSED':(ST.gListening?'LISTENING':'UP NEXT'))) : '';
    const tagCol = isCur && (ST.playing||ST.gListening) ? '#f24822' : '#8a8a8a';
    const col = kind==='played' ? '#b0b0b0' : '#1b1b1b';
    const subCol = kind==='played' ? '#c4c4c4' : (isCur?'#1b1b1b':'#8a8a8a');
    const iconName = kind==='played' ? 'check' : (isCur ? (ST.playing?'pause':'play_arrow') : '');
    const hasVotes = kind==='up' && gs.order && (ST.orderVotes[id]||0)>0;
    return `<div class="row" style="gap:8px;padding:12px 0;border-bottom:1px solid var(--b2);cursor:pointer;justify-content:space-between" data-act="startGig" data-id="${id}">
      <div style="min-width:0;flex:1">
        ${isCur?`<div style="font-size:10px;font-weight:800;letter-spacing:.08em;color:${tagCol};margin-bottom:3px">${tag}</div>`:''}
        <div style="font-size:14px;font-weight:${isCur?700:400};color:${col};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.title||'Untitled song')}</div>
        <div style="font-size:11px;color:${subCol};font-weight:${isCur?600:400};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.sub)}</div>
      </div>
      ${hasVotes?`<span style="font-size:11px;font-weight:700;color:#6f6f6f;display:flex;align-items:center">${icon('arrow_drop_up',16)}${ST.orderVotes[id]||0}</span>`:''}
      <span style="color:${kind==='played'?'#c4c4c4':'#1b1b1b'}">${iconName?icon(iconName,18):''}</span>
    </div>`;
  };
  let queueHTML = '';
  if(gq.cued) queueHTML += qRow(gq.cued,'cur');
  gq.up.forEach(id=> queueHTML += qRow(id,'up'));
  if(gq.played.length){ queueHTML += `<div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#9a9a9a;padding:22px 0 6px">PLAYED</div>`; gq.played.forEach(id=> queueHTML += qRow(id,'played')); }

  const guestCount = 23 + ' guests';
  const chordScale = Math.max(0.55, Math.min(1.9, ST.chordH/230));
  const hint = !gigHasLyrics ? 'Tap another song to continue' : (ST.playing ? 'Tap the song in the list to pause' : (gStarted ? 'Paused · tap the song to resume' : (ST.startMode==='countdown' ? 'Tap a song in the list to start · 3-2-1 countdown' : 'Tap a song in the list to start listening')));

  return `<div class="gigplayer-grid">
    <div class="gigplayer-side">

  switch(ST.screen){
    case 'login': html = renderLogin(); break;
    case 'home': html = renderHome(); break;
    case 'list': html = renderList(); break;
    case 'search': html = renderSearch(); break;
    case 'account': html = renderAccount(); break;

    case 'create': html = renderCreate(); break;

  const sc = document.getElementById('lyricsScroll');
  if(sc){ const cur = sc.querySelector('[data-cur]'); }

function autoChordsFor(lyrics){
  const cyc = ['Am','F','G','C'], out = {};
  parseLyrics(lyrics).forEach((ws,li)=>{ out[li+'-0']=cyc[li%4]; if(ws.length>3) out[li+'-'+Math.floor(ws.length/2)]=cyc[(li+1)%4]; });
  return out;
}
function openSongOrIncomplete(id, from){
  const s = song(id);
  const ok = s.lyrics && s.lyrics.trim();
  ST.songId = id; ST.viewBy=null; ST.viewChord=null; ST.menu=false; ST.instMenu=false; ST.ctx='view'; ST.t=0; ST.playing=false; ST.vcd=0; ST.sortOpen=false;
  ST.screen = ok ? 'song' : 'incomplete';
  ST.back = from || ST.screen;
}
function newSongDraft(){
  const id = 'n'+Date.now();
  D.songs[id] = { id, title:'', sub:'', lyrics:'', chords:{}, notes:{}, synced:false, plays:0, added:Date.now(), mine:true };
  D.order = [id, ...D.order];
  ST.editId = id; ST.screen='create'; ST.createMode='manual'; ST.step='lyrics'; ST.phase='idle'; ST.selWord=null; ST.similar=false; ST.menu=false; ST.isPublic=false; ST.sortOpen=false;
}
function finishSong(){
  const id = ST.editId, s = D.songs[id];
  const patch = { synced:true };
  if(!s.lyrics.trim()) patch.lyrics = EX_LYRICS;
  if(!s.title.trim()) patch.title = "Don't Go Breaking My Heart";
  if(!Object.keys(s.chords).length || ST.autoChords) patch.chords = autoChordsFor(patch.lyrics || s.lyrics);
  Object.assign(s, patch);
  ST.phase='idle'; ST.procPct=0; ST.screen='done'; ST.autoChords=false; ST.songId=id;
}

  stopRecord(){ ST.phase='processing'; ST.procPct=0; render(); },
  abortRecord(){ ST.phase='idle'; ST.bars=[]; render(); },

  openPicker(d){ ST.pick = { kind:d.kind, songId: ST.editId }; render(); },
  closePick(){ ST.pick=null; render(); },
  togglePickPlaylist(d){ const p = D.playlists.find(x=>x.id===d.id); const sid = ST.pick.songId; const on = p.ids.includes(sid); p.ids = on ? p.ids.filter(i=>i!==sid) : [...p.ids, sid]; render(); },
  togglePickGig(d){ const g = D.gigs.find(x=>x.id===d.id); const sid = ST.pick.songId; const on = g.setlist.includes(sid); g.setlist = on ? g.setlist.filter(i=>i!==sid) : [...g.setlist, sid]; render(); },
  closeSongPick(){ ST.songPick=null; ST.spQuery=''; render(); },
  toggleSongPick(d){ const sp = ST.songPick; const isPl = sp.kind==='playlist'; const target = isPl ? D.playlists.find(p=>p.id===sp.id) : D.gigs.find(g=>g.id===sp.id); const ids = isPl?target.ids:target.setlist; const on = ids.includes(d.id); const next = on ? ids.filter(i=>i!==d.id) : [...ids, d.id]; if(isPl) target.ids=next; else target.setlist=next; render(); },
  togglePublic(){ ST.isPublic = !ST.isPublic; render(); },
  viewDone(){ openSongOrIncomplete(ST.editId, 'home'); render(); },
  continueSong(){ ST.editId = ST.songId; ST.screen='create'; ST.createMode='manual'; ST.step='lyrics'; ST.phase='idle'; render(); },

  openNew(d){ ST.newItem = { kind:d.id, name:'', date:'' }; render(); },
  closeNew(){ ST.newItem=null; render(); },
  createNew(){
    const ni = ST.newItem; if(!ni || !ni.name.trim()) return;
    const withSong = ST.pick ? [ST.pick.songId] : [];
    if(ni.kind==='playlist'){
      const id='p'+Date.now(); D.playlists.splice(1,0,{ id, title:ni.name.trim(), ids:withSong, mine:true, added:Date.now(), plays:0 });
      ST.newItem=null; if(!ST.pick){ ST.screen='list'; ST.listKind='songs'; ST.listPl=id; } toast('Playlist created');
    } else {
      const id='g'+Date.now(); D.gigs.unshift({ id, title:ni.name.trim(), date: ni.date.trim()||'Date to be confirmed', setlist:withSong, mine:true, added:Date.now(), plays:0, settings:{} });
      ST.newItem=null; if(!ST.pick){ ST.screen='gig'; ST.gigId=id; } toast('Gig created');
    }
    render();
  },

  toggleMenu(){ ST.menu = !ST.menu; ST.instMenu=false; render(); },
  toggleInstMenu(d,e){ if(e) e.stopPropagation(); ST.instMenu = !ST.instMenu; render(); },
  setInstrumentMenu(d, e){ if(e) e.stopPropagation(); ST.instrument=d.id; ST.menu=false; ST.instMenu=false; render(); },
  menuAddGig(){ ST.menu=false; ST.pick = { kind:'gig', songId: ST.songId }; render(); },
  editSong(){ ST.editId = ST.songId; ST.screen='create'; ST.createMode='manual'; ST.step='chords'; ST.phase='idle'; ST.menu=false; render(); },
  deleteSong(){ if(ST.songId==='dgbmh'){ ST.menu=false; render(); toast('Demo song is used in a gig — remove it there first'); return; } delete D.songs[ST.songId]; D.order = D.order.filter(x=>x!==ST.songId); ST.screen='home'; ST.menu=false; ST.songId='dgbmh'; render(); toast('Song deleted'); },
  copySong(){ ST.viewBy=null; render(); toast('Copied to My songs'); },
  setViewChord(d){ ST.viewChord = d.id; render(); },
  viewPlay(){
    const s = song(ST.songId); const tm = timing(s);
    if(ST.playing){ ST.playing=false; render(); return; }
    if(ST.vcd>0) return;
    const t = ST.t < tm.total ? ST.t : 0;
    if(ST.startMode==='countdown'){ ST.t=t; ST.vcd=3; } else { ST.t=t; ST.playing=true; }
    render();
  },
  playSample(){ ST.sampling = !ST.sampling; ST.sampleLeft = ST.sampling ? 10 : 0; render(); if(ST.sampling) toast('Playing a short preview'); },

  exitPractice(){ ST.playing=false; ST.screen = ST.back==='create' ? 'create' : 'song'; ST.back = ST.back==='create' ? 'home' : ST.back; render(); },
  togglePlay(){ const tm = timing(song(ST.songId)); const t = ST.t>=tm.total ? 0 : ST.t; ST.playing = !ST.playing; ST.t=t; render(); },
  restart(){ ST.t=0; render(); },
  seek(d,e){ const r = e.currentTarget.getBoundingClientRect(); const f = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)); const tm = timing(song(ST.songId)); ST.t = f*tm.total; render(); },
  toggleGuide(){ ST.guide = !ST.guide; render(); },
  setGuideInst(d){ ST.guideInst=d.id; ST.guide=true; render(); },

  gigAddSongs(){ ST.songPick = { kind:'gig', id: gigObj().id }; render(); },
  gigEditOpen(){ ST.screen='gigedit'; ST.editList = [...gigObj().setlist]; render(); },
  gigPhotosOpen(){ ST.screen='gigphotos'; render(); },
  gigAddCollab(){ ST.screen='collab'; ST.back='gig'; ST.collabFor = gigObj().id; render(); },
  openGigSettings(){ ST.gigSettings=true; render(); },
  gigShare(){ toast('Link copied · singa.live/g/'+gigObj().id); },
  openQr(){ ST.qrOpen=true; render(); },
  closeQr(){ ST.qrOpen=false; render(); },
  closeGigSettings(){ ST.gigSettings=false; render(); },
  toggleGigSetting(d){ const g = gigObj(); const gs = gigSettings(g); g.settings = { ...gs, [d.id]: !gs[d.id] }; render(); },
  openGigSong(d){ openPlayer(d.id); render(); },
  goLive(){
    const g = gigObj(); if(!g.setlist.length){ toast('Add songs to this gig first'); return; }
    openPlayer(null); render();
  },
  exitGig(){ ST.screen='gig'; ST.playing=false; render(); },
  startGig(d){
    const g = gigObj();
    if(ST.vcd>0) return;
    const cur = gigSongId();
    const gStarted = ST.playing || ST.t>0;
    if(d.id===cur && gStarted){ ST.playing = !ST.playing; render(); return; }
    if(d.id===cur && ST.gListening){ ST.gListening=false; render(); return; }
    const x = song(d.id); const ok = !!(x.lyrics && x.lyrics.trim());
    const played = (gStarted && cur!==d.id && !ST.played.includes(cur)) ? [...ST.played, cur] : ST.played;
    ST.gigCur = d.id; ST.played = played.filter(p=>p!==d.id); ST.t=0; ST.playing=false; ST._liveGig=g.id; ST.gListening=false;
    if(ok){ if(ST.startMode==='countdown') ST.vcd=3; else ST.gListening=true; }
    render();
  },
  gigHeard(){ ST.gListening=false; ST.playing=true; ST.t=0; render(); },
  editPart(){ toast('Opens Markings for the '+ST.part+' layer'); },
  addPhoto(){ D.photos.push({ id:Date.now(), by:'Ezra', span: Math.random()>0.7?2:1 }); render(); },
  saveGigEdit(){ const g = gigObj(); g.setlist = ST.editList; ST.screen='gig'; ST.editList=null; render(); toast('Setlist saved'); },
  addToSetlist(){ const el = ST.editList; const next = D.order.find(id=>!el.includes(id)); if(next) { ST.editList=[...el,next]; render(); } else toast('Every song is already in this gig'); },
  editRowUp(d){ const i = +d.id; if(!i) return; const l=[...ST.editList]; [l[i-1],l[i]]=[l[i],l[i-1]]; ST.editList=l; render(); },
  editRowRemove(d){ const i = +d.id; ST.editList = ST.editList.filter((_,j)=>j!==i); render(); },

  toggleDark(){ ST.perfDark = !ST.perfDark; render(); }
};

const Binds = {
  email(v){ ST.email=v; render(); },
  homeQuery(v){ ST.homeQuery=v; },
  listQuery(v){ ST.listQuery=v; render(); },
  searchQuery(v){ ST.searchQuery=v; render(); },
  draftTitle(v){ D.songs[ST.editId].title=v; },
  draftSub(v){ D.songs[ST.editId].sub=v; },
  draftLyrics(v){ D.songs[ST.editId].lyrics=v; render(); },
  noteDraft(v){ ST.noteDraft=v; },
  newName(v){ ST.newItem.name=v; render(); },
  newDate(v){ ST.newItem.date=v; },
  spQuery(v){ ST.spQuery=v; render(); },
  ceName(v){ ST.collabEdit.name=v; },
  ceEmail(v){ ST.collabEdit.email=v; }
};
/* ============================================================
   PLAYBACK TICK (simulated — no real audio capture/analysis)
   ============================================================ */
function playId(){ return ST.ctx==='gig' ? gigSongId() : ST.songId; }
function endGigSong(){ const cur = gigSongId(); if(!ST.played.includes(cur)) ST.played=[...ST.played,cur]; ST.gigCur=null; ST.t=0; ST.playing=false; ST.gListening=false; }

function tick(){
  let changed = false;
  if(ST.vcd>0){ const v=ST.vcd-0.1; if(v<=0){ ST.vcd=0; ST.playing=true; } else ST.vcd=v; changed=true; }
  if((ST.ctx==='view' && ST.screen!=='song') || (ST.ctx==='practice' && ST.screen!=='practice')){
    if(ST.playing){ ST.playing=false; changed=true; }
    if(ST.vcd>0){ ST.vcd=0; ST.playing=false; changed=true; }
  }
  if(ST.playing){
    const s = song(playId()); const tm = timing(s);
    let t = ST.t + 0.1;
    if(t>=tm.total){
      if(ST.ctx==='practice') t=0;
      else if(ST.ctx==='view'){ ST.playing=false; t=0; }
      else { endGigSong(); render(); return; }
    }
    ST.t = t; changed=true;
  }
  if(ST.phase==='countdown'){ const cd=ST.cd-0.1; if(cd<=0){ ST.phase='recording'; ST.recT=0; ST.bars=[]; } else ST.cd=cd; changed=true; }
  else if(ST.phase==='recording'){ ST.recT += 0.1; ST.bars=[...ST.bars, 10+Math.round(Math.random()*80)].slice(-18); changed=true; }
  else if(ST.phase==='processing'){ const p=ST.procPct+2.4; if(p>=100){ finishSong(); render(); return; } ST.procPct=p; changed=true; }
  if(ST.sampling){ ST.sampleLeft = Math.max(0, ST.sampleLeft-0.1); if(ST.sampleLeft<=0) ST.sampling=false; changed=true; }
  if(changed) render();
}
setInterval(tick, 100);

/* ============================================================
   EVENT WIRING (delegation)
   ============================================================ */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  if(Actions[act]) Actions[act](t.dataset, e);
});

document.addEventListener('input', function(e){
  const t = e.target.closest('[data-bind]');
  if(!t) return;
  const name = t.dataset.bind;
  const pos = t.selectionStart, posEnd = t.selectionEnd;
  if(Binds[name]) Binds[name](t.value, t.dataset);
  requestAnimationFrame(function(){
    const el = document.querySelector('[data-bind="'+name+'"]');
    if(el && el !== document.activeElement){
      el.focus();
      try{ el.setSelectionRange(pos, posEnd); }catch(err){}
    }
  });
});

document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  const t = e.target.closest('[data-key]');
  if(!t) return;
  const act = t.dataset.key;
  if(Actions[act]) Actions[act](t.dataset, e);
});

document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  ST.phase = 'processing'; ST.procPct = 0; render();
});

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
