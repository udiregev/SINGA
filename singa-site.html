<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singa — Desktop Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Singa — shared stylesheet for all surfaces (Performer App, Desktop Website,
   Audience Guest Site, Gig TV / Monitor Portal). Tokens match the product's
   real design system (Hanken Grotesk / Source Serif 4 / Caveat, warm paper
   background, orange-red accent). Each surface is its own full-bleed page —
   there is no shared "switcher" chrome here; this file only holds the real
   UI patterns a shipped page would use. */

:root{
  --bg:#ffffff; --canvas:#ecebe8; --fg:#1b1b1b; --fg-muted:#77756f;
  --border:#dcdad5; --accent:#f24822; --accent-fg:#ffffff;
  --live:#f24822; --spotify:#1db954; --youtube:#ff0000;
  --font-display:'Source Serif 4',Georgia,serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --font-hand:'Caveat',cursive;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  --statusbar-h:28px; --header-h:56px; --bottomnav-h:60px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;}
a{color:inherit;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
[hidden]{display:none!important;}
svg.icon{width:20px;height:20px;flex:none;display:block;}
svg.icon-sm{width:16px;height:16px;}
svg.icon-lg{width:26px;height:26px;}

/* ================= native status bar (phone-width simulation) ================= */
.statusbar{height:var(--statusbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:600;color:var(--fg);background:var(--bg);flex:none;}
.statusbar .right{display:flex;align-items:center;gap:5px;}
.statusbar svg{display:block;}
.statusbar-dark{background:#0d0d0d;color:#fff;}

/* ================= app shell layout ================= */
.app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);}
.app-header{flex:none;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid transparent;position:relative;}
.app-header .wordmark{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em;}
.app-header .iconbtn{background:none;border:none;color:var(--fg);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.app-header .iconbtn:hover{background:var(--canvas);}
.app-body{flex:1;display:flex;min-height:0;}
.app-main{flex:1;min-width:0;overflow-y:auto;padding:4px 18px 32px;}
.app-main.narrow{max-width:640px;margin:0 auto;width:100%;}

/* persistent left sidebar — shown at tablet/desktop widths (matches the real
   design's split-pane layout: a song/context list stays visible beside the
   active screen rather than being a separate "page"). */
.app-sidebar{display:none;flex:none;width:280px;border-right:1px solid var(--border);padding:18px 14px 18px;overflow-y:auto;}
.app-sidebar .side-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);margin:16px 6px 8px;}
.app-sidebar .side-title:first-child{margin-top:2px;}
.app-sidebar .list-row{padding-left:6px;padding-right:6px;}
.app-sidebar .navtabs{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.app-sidebar .navtabs button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;padding:9px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--fg-muted);cursor:pointer;}
.app-sidebar .navtabs button.active{background:var(--canvas);color:var(--fg);}

/* bottom tab bar — shown at phone widths */
.bottom-nav{display:flex;flex:none;border-top:1px solid var(--border);background:var(--bg);height:var(--bottomnav-h);}
.bottom-nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--fg-muted);cursor:pointer;}
.bottom-nav button.active{color:var(--fg);}

@media (min-width:860px){
  .app-sidebar{display:flex;flex-direction:column;}
  .bottom-nav{display:none;}
  .app-main{padding:8px 32px 40px;}
  .statusbar{display:none;}
  .app-header{display:none;}
}

/* ================= generic UI ================= */
.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;color:var(--fg);font-family:inherit;}
.input::placeholder{color:#a6a49d;}
textarea.input{resize:vertical;min-height:90px;}
.input-icon-wrap{position:relative;}
.input-icon-wrap .input{padding-right:40px;}
.input-icon-wrap svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--fg-muted);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--radius-sm);padding:13px 16px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;}
.btn-primary{background:var(--fg);color:#fff;}
.btn-primary:disabled{opacity:.35;cursor:default;}
.btn-accent{background:var(--accent);color:var(--accent-fg);}
.btn-outline{background:transparent;color:var(--fg);border:1.5px solid var(--border);}
.btn-ghost{background:none;border:none;color:var(--fg-muted);font-size:13px;cursor:pointer;width:auto;padding:6px;font-family:inherit;}
.btn-sm{width:auto;padding:8px 13px;font-size:13px;}
.btn:disabled{opacity:.5;cursor:default;}
.row{display:flex;gap:8px;align-items:center;}
.rowbetween{display:flex;gap:8px;align-items:center;justify-content:space-between;}
.stack{display:flex;flex-direction:column;gap:12px;}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center;}

.seg{display:flex;background:var(--bg);border:1px solid var(--fg);border-radius:10px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg);font-family:inherit;}
.seg button.active{background:var(--fg);color:#fff;}

.subtabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.subtabs button{border:none;background:none;padding:0 0 10px;font-size:14px;font-weight:600;color:var(--fg-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;}
.subtabs button.active{color:var(--fg);border-bottom-color:var(--fg);}

.section-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);margin:20px 0 8px;}
.list{border-top:1px solid var(--border);}
.list-row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0;}
.list-row .meta{min-width:0;flex:1;}
.list-row .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row .s{font-size:12.5px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.list-row .chev{color:#b9b7b0;flex:none;}
.icon-src{width:18px;height:18px;border-radius:5px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
.badge{font-size:10px;letter-spacing:.03em;padding:3px 8px;border-radius:999px;font-weight:700;flex:none;text-transform:uppercase;}
.badge-synced{background:var(--canvas);color:var(--fg-muted);border:1px solid var(--border);}
.badge-notake{background:var(--canvas);color:var(--fg-muted);border:1px solid var(--border);}
.badge-live{background:var(--accent);color:#fff;}
.fab{position:fixed;right:22px;bottom:calc(var(--bottomnav-h) + 18px);width:56px;height:56px;border-radius:50%;background:var(--fg);color:#fff;border:none;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
@media (min-width:860px){.fab{display:none;}}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:80;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
@media (min-width:860px){.toast{bottom:22px;}}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--canvas);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--fg-muted);}

/* sheet / overflow menu / modal */
.sheet-backdrop{position:fixed;inset:0;background:rgba(27,27,27,.28);z-index:60;}
.sheet{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 18px 40px -12px rgba(0,0,0,.25);padding:14px 18px;min-width:220px;z-index:70;text-align:right;}
.sheet button{display:block;width:100%;text-align:right;background:none;border:none;padding:8px 0;font-size:15px;font-weight:600;color:var(--fg);cursor:pointer;font-family:inherit;}
.sheet button.danger{color:var(--accent);}
.sheet hr{border:none;border-top:1px solid var(--border);margin:6px 0;}
.modal-backdrop{position:fixed;inset:0;background:rgba(27,27,27,.4);display:flex;align-items:center;justify-content:center;padding:24px;z-index:90;}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:24px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}

/* word / chord / marking editor */
.lyricline{margin-bottom:18px;}
.wordrow{display:flex;flex-wrap:wrap;gap:4px 10px;}
.wordcell{display:flex;flex-direction:column;align-items:flex-start;min-width:0;}
.chordlabel{font-size:12px;font-weight:700;color:var(--accent);height:16px;}
.markflag{font-size:10px;color:var(--accent);}
.word{font-size:16px;background:none;border:none;color:var(--fg);padding:0;cursor:pointer;font-family:inherit;}
.word.clickable:hover{text-decoration:underline;text-decoration-style:dotted;}
.inline-editor{margin:10px 0 2px;padding:12px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-sm);}
.markpill{display:inline-block;background:#eaf2ff;color:#2a5ad1;border:1px solid #c8dcff;border-radius:7px;padding:1px 6px;font-size:11.5px;font-family:var(--font-hand);margin-left:6px;}
.marknote{font-family:var(--font-hand);font-size:18px;color:#3e7bff;margin-top:2px;line-height:1.1;}

/* chord diagram */
.chorddiagram{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 6px;}
.fretgrid{display:grid;grid-template-columns:repeat(6,14px);grid-template-rows:repeat(4,14px);gap:3px;}
.fretgrid .fret{width:14px;height:14px;border:1.5px solid var(--border);border-radius:50%;}
.fretgrid .fret.on{background:var(--fg);border-color:var(--fg);}
.chordname{font-family:var(--font-display);font-size:22px;font-weight:700;}

/* waveform */
.wave{display:flex;align-items:flex-end;gap:3px;height:60px;justify-content:center;margin:16px 0;}
.wave span{width:4px;background:var(--accent);border-radius:2px;transition:height .12s;}

/* mascot */
.mascot{width:160px;height:auto;margin:0 auto;}

/* register / auth */
.auth-screen{max-width:360px;margin:0 auto;padding:40px 20px 24px;}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--fg-muted);font-size:12px;margin:4px 0;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border);}
.btn-social{background:var(--bg);color:var(--fg);border:1.5px solid var(--border);}

/* ================= audience guest site ================= */
.aud-app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background .2s,color .2s;}
.aud-app.dark{background:#0d0d0d;color:#f2f2f0;}
.aud-app .app-header{border-bottom:none;}
.aud-app .themebtn{display:flex;align-items:center;gap:6px;background:none;border:none;color:inherit;cursor:pointer;padding:6px 8px;border-radius:999px;}
.aud-lyrics{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 26px 40px;gap:14px;max-width:560px;margin:0 auto;width:100%;}
.aud-line{font-family:var(--font-display);font-size:clamp(19px,5vw,28px);font-weight:600;color:var(--fg-muted);transition:color .2s,opacity .2s;opacity:.55;line-height:1.35;}
.aud-app.dark .aud-line{color:#8b8b88;}
.aud-line.current{color:var(--fg);opacity:1;}
.aud-app.dark .aud-line.current{color:#fff;}
.aud-songmeta{max-width:560px;margin:0 auto;width:100%;padding:14px 26px 0;}
.aud-songmeta .t{font-size:15px;font-weight:700;}
.aud-songmeta .by{font-size:12px;color:var(--fg-muted);margin-top:2px;}
.aud-qr-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 24px;flex:1;justify-content:center;}
.qr{display:grid;gap:2px;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--border);}
.qr div{background:#0d0d0d;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px;}
.photo-tile{aspect-ratio:1;border-radius:10px;background:var(--canvas);}
@media (min-width:640px){.photo-grid{grid-template-columns:repeat(4,1fr);}}

/* ================= TV / monitor portal ================= */
.tv-app{min-height:100vh;background:#0d0d0d;color:#fff;display:flex;flex-direction:column;font-family:var(--font-body);position:relative;overflow:hidden;}
.tv-top{display:flex;justify-content:space-between;align-items:center;padding:22px 32px 0;flex:none;}
.tv-top .wordmark{font-family:var(--font-display);font-size:20px;font-weight:700;color:#fff;}
.tv-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 56px;gap:14px;max-width:1100px;}
.tv-line{font-family:var(--font-display);font-size:clamp(22px,4.2vw,42px);font-weight:600;color:#54534f;transition:color .25s;line-height:1.3;}
.tv-line.current{color:#fff;}
.tv-qr-corner{position:absolute;left:32px;bottom:28px;display:flex;align-items:center;gap:12px;}
.tv-qr-corner .qr{background:#fff;}
.tv-qr-corner .meta .t{font-weight:700;font-size:14px;color:#fff;}
.tv-qr-corner .meta .s{font-size:12px;color:#9c9b97;}
.tv-takeover{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;padding:40px;}
.tv-next-label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#9c9b97;font-weight:700;}
.tv-next-title{font-family:var(--font-display);font-size:clamp(26px,4vw,46px);font-weight:700;color:#fff;margin-top:6px;}
.tv-next-sub{color:#9c9b97;font-size:16px;margin-top:4px;}
.tv-scanme{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.tv-scanme .label{background:#0d0d0d;color:#fff;font-weight:800;letter-spacing:.04em;font-size:13px;padding:6px 14px;border-radius:999px;}
.tv-divider{width:1px;align-self:stretch;background:#2a2a28;}

</style>
</head>
<body>
<div class="app">
  <div class="statusbar" id="statusbar"></div>
  <div class="app-header" id="header"></div>
  <div class="app-body">
    <div class="app-sidebar" id="sidebar"></div>
    <div class="app-main narrow" id="main"></div>
  </div>
  <div class="bottom-nav" id="bottomnav"></div>
</div>
<button class="fab" id="fab" data-act="createNew" aria-label="Add a song"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast"></div>
<script>

};
function icon(name){ return ICONS[name]||""; }

/* ============================== shared app state ============================== */
var STORE_KEY = "singa_prototype_v2";

function defaultState(){
  var state = {
    songs:{
      dgbmh:{ id:"dgbmh", title:"Don't Go Breaking My Heart", sub:"Dolly Parton and the booland. Long version 2009", addedBy:"you", synced:true, instrument:"guitar",
        lines:[

/* ============================== helpers ============================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function words(line){ return line.text.split(/\s+/).filter(Boolean); }
function chordAt(line, wi){ var f=(line.chords||[]).filter(function(c){return c.w===wi;}); return f[0]||null; }
function marksAt(line, wi){ return (line.marks||[]).filter(function(m){return m.w===wi;}); }
function srcIcon(source){
  if(source==="spotify") return '<span class="icon-src" style="background:var(--spotify)">♫</span>';
  if(source==="youtube") return '<span class="icon-src" style="background:var(--youtube)">▶</span>';
  return "";
}
function songsIn(playlist){ return playlist.songs.map(function(id){return STATE.songs[id];}).filter(Boolean); }
function hashNum(str){ var h=0; for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;} return h; }
function fretDots(sym){
  var h = hashNum(sym||"X");
  var cells=[];
  for(var i=0;i<24;i++){ cells.push(((h>>i)&1) && (i%4!==3) ? 1:0); }
  return cells;
}
function qrPattern(seed, size, cell){
  var h = hashNum(seed);
  var out = '<div class="qr" style="grid-template-columns:repeat('+size+','+cell+'px)">';
  for(var i=0;i<size*size;i++){
    var bit = (h >> (i%30)) & 1;
    var corner = (i<9 && i%size<3) || (i>=size*(size-3) && i%size<3) || (i<3*size && i%size>=size-3);
    var on = corner || bit;
    out += '<div style="width:'+cell+'px;height:'+cell+'px;opacity:'+(on?1:0)+'"></div>';
  }
  out += '</div>';
  return out;
}
var toastTimer;
function toast(msg){
  var el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}
function go(screen, extra){

/* ============================== render: lyric lines ============================== */
function renderLineDisplay(line){
  var w = words(line);
  var html = '<div class="lyricline"><div class="wordrow">';
  var noteTexts = [];
  w.forEach(function(word, wi){
    var ch = chordAt(line, wi);
    var mk = marksAt(line, wi);
    if(mk.length) mk.forEach(function(m){ noteTexts.push('"'+esc(m.text)+'" near "'+esc(word)+'"'); });
    html += '<span class="wordcell"><span class="chordlabel">'+(ch?esc(ch.sym):"")+'</span><span class="word">'+esc(word)+(mk.length?'<span class="markflag" title="'+esc(mk.map(function(m){return m.text;}).join(", "))+'"> ✦</span>':'')+'</span></span>';
  });
  html += '</div>';
  if(noteTexts.length) html += '<div class="marknote">'+noteTexts.join(" · ")+'</div>';
  html += '</div>';
  return html;
}

function renderLineEditable(line, li, kind, activePos){
  var w = words(line);
  var html = '<div class="lyricline"><div class="wordrow">';
  w.forEach(function(word, wi){
    var ch = chordAt(line, wi);
    var mk = marksAt(line, wi);
    html += '<span class="wordcell"><span class="chordlabel">'+(kind==="chords"&&ch?esc(ch.sym):"")+'</span>'+
      '<button class="word clickable" data-act="pickword" data-li="'+li+'" data-wi="'+wi+'" data-kind="'+kind+'">'+esc(word)+
      (kind==="markings"&&mk.length?'<span class="markflag"> ✦</span>':"")+'</button></span>';
  });
  html += '</div>';
  if(kind==="markings" && line.marks && line.marks.length){
    html += '<div class="marknote">'+line.marks.map(function(m){return '"'+esc(m.text)+'"';}).join(" · ")+'</div>';
  }
  if(activePos && activePos.li===li){
    var wi2 = activePos.wi, wordTxt = w[wi2];
    if(kind==="chords"){
      var existing = chordAt(line, wi2);
      html += '<div class="inline-editor"><div class="section-h" style="margin-top:0">Chord on "'+esc(wordTxt)+'"</div>'+
        '<div class="row"><input class="input" id="chordInput" placeholder="e.g. Am" value="'+(existing?esc(existing.sym):"")+'">'+
        '<button class="btn btn-primary btn-sm" data-act="addChord" data-li="'+li+'" data-wi="'+wi2+'">Add</button></div>'+
        '<div class="row" style="margin-top:6px">'+
        (existing?'<button class="btn btn-outline btn-sm" data-act="removeChord" data-li="'+li+'" data-wi="'+wi2+'">Remove</button>':'')+
        '<button class="btn-ghost" data-act="cancelPick">Cancel</button></div></div>';
    } else {
      var exM = marksAt(line, wi2)[0];
      html += '<div class="inline-editor"><div class="section-h" style="margin-top:0">Marking on "'+esc(wordTxt)+'"</div>'+
        '<textarea class="input" id="markInput" placeholder="e.g. Hi note, Before cue…">'+(exM?esc(exM.text):"")+'</textarea>'+
        '<div class="row" style="margin-top:6px"><button class="btn btn-primary btn-sm" data-act="addMark" data-li="'+li+'" data-wi="'+wi2+'">Add</button>'+
        (exM?'<button class="btn btn-outline btn-sm" data-act="removeMark" data-li="'+li+'" data-wi="'+wi2+'">Remove</button>':'')+
        '<button class="btn-ghost" data-act="cancelPick">Cancel</button></div></div>';
    }
  }
  html += '</div>';
  return html;
}

    h += '<div class="stack" style="margin-top:18px">'+
      '<button class="btn btn-outline" data-act="practiceSong">Practice</button>'+
      '<button class="btn btn-accent" data-act="startRecord">Record</button>'+
      '<button class="btn-ghost" style="width:100%;text-align:center" data-act="uploadTake">Upload</button>'+

      '<button class="btn-ghost" style="width:100%;text-align:center" data-act="skipSync">Skip</button>'+
      '</div>';

/* ============================== event handling ============================== */
document.addEventListener("click", function(e){
  var btn = e.target.closest("[data-act]");
  if(!btn) return;
  var act = btn.getAttribute("data-act");
  handleAction(act, btn);
});
document.addEventListener("change", function(e){
  var bindEl = e.target.closest("[data-bind]");
  if(!bindEl) return;
  handleBind(bindEl.getAttribute("data-bind"), bindEl);
});
document.addEventListener("input", function(e){
  var bindEl = e.target.closest("[data-bind]");
  if(!bindEl) return;
  var bind = bindEl.getAttribute("data-bind");
  if(bind==="homesearch" || bind==="libsearch"){ UI.libQuery = bindEl.value; render(); }
  else if(bind==="draftTitle"){ UI.draft.title = bindEl.value; }
  else if(bind==="draftSub"){ UI.draft.sub = bindEl.value; }
  else if(bind==="draftLyrics"){ UI.draft.lyricsText = bindEl.value; }
  else if(bind==="acctName"){ STATE.account.nickname = bindEl.value; }
  else if(bind==="acctEmail"){ STATE.account.email = bindEl.value; }
});

function handleBind(bind, el){
  if(bind==="draftRights"){ UI.draft.rightsConfirmed = el.checked; }
  else if(bind==="draftAddPlaylist"){ UI.draft.addToPlaylist = el.checked; }
  else if(bind==="draftAddGig"){ UI.draft.addToGig = el.checked ? GIG_ID : ""; }
  else if(bind==="draftPublic"){ UI.draft.makePublic = el.checked; }
  render();
}

function handleAction(act, btn){
  var id = btn.getAttribute("data-id");
  var gigId = btn.getAttribute("data-gig") || UI.gigId;
  switch(act){
    case "back": back(); break;
    case "goto": go(btn.getAttribute("data-screen")); break;
    case "openSong": go("song", {viewerId:id, menuOpen:false, confirmDelete:false}); break;
    case "openPlaylist": go("playlist", {openPlaylistId:id}); break;
    case "openGig": go("gig", {gigId:id}); break;
    case "openCollaborators": go("collaborators", {gigId:gigId}); break;
    case "openGigPlayer": go("gigplayer", {gigId:gigId}); break;
    case "gigEdit": go("gigedit", {gigId:gigId}); break;
    case "gigPhotos": go("gigphotos", {gigId:gigId}); break;
    case "gigQr": go("gigqr", {gigId:gigId}); break;
    case "libTab": UI.libTab = btn.getAttribute("data-tab"); UI.libQuery=""; render(); return;
    case "createNew": UI.draft = newDraft(null); go("create"); break;
    case "menuEdit": UI.menuOpen=false; UI.draft = newDraft(STATE.songs[UI.viewerId]); go("create"); break;
    case "menuAddNew": UI.menuOpen=false; UI.draft = newDraft(null); go("create"); break;
    case "menuInstrument": {
      var s = STATE.songs[UI.viewerId];
      var order = ["guitar","ukulele","piano"];
      s.instrument = order[(order.indexOf(s.instrument)+1)%order.length];
      UI.menuOpen=false; saveState(); return;
    }
    case "menuSettings": UI.menuOpen=false; toast("Full settings — not wired in this prototype"); render(); return;
    case "menuDelete": {
      if(UI.confirmDelete){
        var sid = UI.viewerId;
        delete STATE.songs[sid];
        STATE.playlists.forEach(function(p){ p.songs = p.songs.filter(function(x){return x!==sid;}); });
        Object.keys(STATE.gigs).forEach(function(gid){ STATE.gigs[gid].setlist = STATE.gigs[gid].setlist.filter(function(x){return x!==sid;}); });
        UI.confirmDelete=false; UI.menuOpen=false; back(); saveState();
      } else { UI.confirmDelete = true; render(); }
      return;
    }
    case "toggleMenu": UI.menuOpen = !UI.menuOpen; render(); return;
    case "createMode": UI.draft.mode = btn.getAttribute("data-mode"); render(); return;
    case "createStep": case "toStep": UI.draft.step = btn.getAttribute("data-step"); render(); return;
    case "useSample": {
      var sample = STATE.songs.dgbmh;
      UI.draft.title = sample.title; UI.draft.sub = sample.sub;
      UI.draft.lines = JSON.parse(JSON.stringify(sample.lines));
      UI.draft.lyricsText = sample.lines.map(function(l){return l.text;}).join("\n");
      UI.draft.step="chords"; render(); return;
    }
    case "lyricsNext": {
      var d = UI.draft;
      if(!d.lyricsText.trim()){ toast("Add some lyrics first"); render(); return; }
      if(!d.lines.length){ d.lines = d.lyricsText.split("\n").filter(function(l){return l.trim();}).map(function(t){return {text:t.trim(), chords:[], marks:[]};}); }
      var looksSimilar = d.title.toLowerCase().indexOf("breaking my heart")>-1 || d.title.toLowerCase().indexOf("don't go")>-1;
      if(looksSimilar && !d.similarOpen){ d.similarOpen = true; render(); return; }
      d.step = "chords"; render(); return;
    }
    case "useExisting": toast("Opening community version (prototype)"); render(); return;
    case "continueMine": UI.draft.similarOpen=false; UI.draft.step="chords"; render(); return;
    case "pickword": {
      var li = parseInt(btn.getAttribute("data-li"),10), wi = parseInt(btn.getAttribute("data-wi"),10), kind = btn.getAttribute("data-kind");
      if(kind==="chords") UI.draft.activeChordPos = {li:li,wi:wi};
      else UI.draft.activeMarkPos = {li:li,wi:wi};
      render(); return;
    }
    case "cancelPick": UI.draft.activeChordPos=null; UI.draft.activeMarkPos=null; render(); return;
    case "addChord": case "removeChord": {
      var li2 = parseInt(btn.getAttribute("data-li"),10), wi2 = parseInt(btn.getAttribute("data-wi"),10);
      var line = UI.draft.lines[li2];
      line.chords = (line.chords||[]).filter(function(c){return c.w!==wi2;});
      if(act==="addChord"){
        var val = document.getElementById("chordInput").value.trim();
        if(val) line.chords.push({w:wi2, sym:val});
      }
      UI.draft.activeChordPos=null; render(); return;
    }
    case "addMark": case "removeMark": {
      var li3 = parseInt(btn.getAttribute("data-li"),10), wi3 = parseInt(btn.getAttribute("data-wi"),10);
      var line2 = UI.draft.lines[li3];
      line2.marks = (line2.marks||[]).filter(function(m){return m.w!==wi3;});
      if(act==="addMark"){
        var val2 = document.getElementById("markInput").value.trim();
        if(val2) line2.marks.push({w:wi3, text:val2});
      }
      UI.draft.activeMarkPos=null; render(); return;
    }
    case "practiceSong": toast("No synced take yet to practice against"); return;
    case "startRecord": {
      UI.draft.syncPhase="countdown"; UI.draft.countdownN=3; render();
      var tick = function(){
        UI.draft.countdownN--;
        if(UI.draft.countdownN<=0){ UI.draft.syncPhase="recording"; UI.draft.recordSeconds=0; UI.draft.waveHeights=new Array(28).fill(6); render(); runRecordTimers(); }
        else { render(); setTimeout(tick,700); }
      };
      setTimeout(tick,700);
      return;
    }
    case "stopRecord": clearInterval(UI._recTimer); clearInterval(UI._waveTimer); UI.draft.syncPhase="syncing"; render(); runSyncTimer(); return;
    case "abortRecord": clearInterval(UI._recTimer); clearInterval(UI._waveTimer); UI.draft.syncPhase="idle"; render(); return;
    case "uploadTake": UI.draft.syncPhase="syncing"; render(); runSyncTimer(); return;
    case "skipSync": finalizeDraft(false); render(); return;
    case "viewFinishedSong": go("song",{viewerId:UI.draft.id}); break;
    case "addAnotherSong": UI.draft = newDraft(null); go("create"); break;
    case "startGig": {
      var g = STATE.gigs[gigId]; g.live=true; g.currentSongIdx=0; g.currentLineIdx=0; g.tvScreen="lyrics"; saveState(); toast("Gig is live — Audience and TV are now following"); return;
    }
    case "endGig": { var g2 = STATE.gigs[gigId]; g2.live=false; g2.tvScreen="next"; saveState(); back(); return; }
    case "moveUp": case "moveDown": {
      var i = parseInt(btn.getAttribute("data-i"),10);
      var list = STATE.gigs[gigId].setlist;
      var j = act==="moveUp" ? i-1 : i+1;
      if(j<0||j>=list.length) return;
      var tmp=list[i]; list[i]=list[j]; list[j]=tmp; saveState(); return;
    }
    case "removeFromSetlist": {
      var i2 = parseInt(btn.getAttribute("data-i"),10);
      STATE.gigs[gigId].setlist.splice(i2,1); saveState(); return;
    }
    case "copyLink": {
      var url = "https://"+STATE.gigs[gigId].url.replace("/tv/","/g/");
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){toast("Link copied");}).catch(function(){toast("Link ready to share");}); }
      else toast("Link ready to share");
      return;
    }
    case "addPhotoOwner": {
      var colors=["#c6481f","#4169c7","#2a9d6b","#8e4fd6","#d6a84f"];
      STATE.gigs[gigId].photos.unshift(colors[Math.floor(Math.random()*colors.length)]);
      saveState(); return;
    }
    case "inviteCollaborator": {
      var nameEl = document.getElementById("invName"), emailEl = document.getElementById("invEmail");
      var gigsChecked = Array.prototype.slice.call(document.querySelectorAll(".invGig:checked")).map(function(c){return c.value;});
      if(!nameEl.value.trim()){ toast("Enter a nickname"); return; }
      STATE.collaborators.push({name:nameEl.value.trim(), email:emailEl.value.trim(), gigs:gigsChecked});
      saveState(); toast("Invited"); return;
    }
    case "prevLine": { var g3=STATE.gigs[gigId]; if(g3.currentLineIdx>0){g3.currentLineIdx--; saveState();} return; }
    case "nextLine": {
      var g4=STATE.gigs[gigId]; var song4=STATE.songs[g4.setlist[g4.currentSongIdx]];
      if(g4.currentLineIdx<song4.lines.length-1){g4.currentLineIdx++; saveState();} return;
    }
    case "prevSong": { var g5=STATE.gigs[gigId]; if(g5.currentSongIdx>0){g5.currentSongIdx--; g5.currentLineIdx=0; saveState();} return; }
    case "nextSong": { var g6=STATE.gigs[gigId]; if(g6.currentSongIdx<g6.setlist.length-1){g6.currentSongIdx++; g6.currentLineIdx=0; saveState();} return; }
    case "tvScreen": STATE.gigs[gigId].tvScreen = btn.getAttribute("data-mode"); saveState(); return;
    case "toggleNotif": {
      var gid=btn.getAttribute("data-gig"), k=btn.getAttribute("data-k");
      STATE.gigs[gid].notif[k] = !STATE.gigs[gid].notif[k]; saveState(); return;
    }
    case "playSample": toast("Playing sample chord…"); return;
    default: break;
  }
  render();
}

function runRecordTimers(){
  UI._recTimer = setInterval(function(){
    UI.draft.recordSeconds++;
    render();
  }, 1000);
  UI._waveTimer = setInterval(function(){
    UI.draft.waveHeights = UI.draft.waveHeights.map(function(){ return 6 + Math.round(Math.random()*44); });
    var el = document.getElementById("waveEl");
    if(el) el.innerHTML = UI.draft.waveHeights.map(function(v){return '<span style="height:'+v+'px"></span>';}).join("");
  }, 140);
}
function runSyncTimer(){
  setTimeout(function(){
    var bar = document.getElementById("syncBar");
    if(bar) bar.style.width = "100%";
  }, 50);
  setTimeout(function(){
    finalizeDraft(true);
    render();
  }, 1900);
}
function finalizeDraft(synced){
  var d = UI.draft;
  var id = d.id || ("song"+Date.now());
  if(!d.lines.length && d.lyricsText.trim()){ d.lines = d.lyricsText.split("\n").filter(function(l){return l.trim();}).map(function(t){return {text:t.trim(), chords:[], marks:[]};}); }
  STATE.songs[id] = { id:id, title:d.title||"Untitled", sub:d.sub||"", addedBy:"you", synced:synced, instrument:"guitar", lines:d.lines.length?d.lines:[{text:"(no lyrics)",chords:[],marks:[]}] };
  if(d.addToPlaylist){ var pl = STATE.playlists.find(function(p){return p.id==="mysongs";}); if(pl && pl.songs.indexOf(id)===-1) pl.songs.push(id); }
  if(d.addToGig){ var g = STATE.gigs[d.addToGig]; if(g && g.setlist.indexOf(id)===-1) g.setlist.push(id); }
  d.id = id;
  d.syncPhase = "done";
  saveState();
}

/* ============================== init ============================== */
renderStatusBar();
render();
})();

</script>
</body>
</html>
